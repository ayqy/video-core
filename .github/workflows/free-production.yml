                  print(captured[-9000:].decode('utf-8',errors='replace'),file=sys.stderr);raise
              assert len(result.stdout.encode())<=16*1024*1024
              if result.returncode:
                  failure_lines=[line for line in result.stdout.splitlines() if re.search(r"(?:\berror:|Test (?:Case|Suite) '[^\r\n]*' failed\b)",line)]
                  diagnostic='\n'.join(failure_lines).encode('utf-8',errors='replace')
                  diagnostic_limit=256*1024
                  print('public_failure_diagnostics_begin label='+label+' matched_lines='+str(len(failure_lines))+' bytes='+str(len(diagnostic))+' truncated='+str(len(diagnostic)>diagnostic_limit).lower(),file=sys.stderr)
                  print(diagnostic[:diagnostic_limit].decode('utf-8',errors='replace'),file=sys.stderr)
                  print('public_failure_diagnostics_end',file=sys.stderr)
                  print(result.stdout.encode('utf-8',errors='replace')[-9000:].decode('utf-8',errors='replace'),file=sys.stderr)
                  raise RuntimeError(label+' failed')
              print(label+'_passed=true elapsed_seconds='+format(time.monotonic()-started,'.3f'))
              return result.stdout
