name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  story-speech-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact current payload and protected baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',(root/'SOURCE-MANIFEST.md').read_text())
          rows={name:(digest,int(size)) for digest,size,name in entries}
          assert len(entries)==len(rows)==293
          for name,(digest,size) in rows.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          metadata={'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(rows)|metadata|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          BASE_PUBLIC_COMMIT='b114079889f914ab36c95d2ccae3868d615ca613'
          ADDITIONS={'Integrations/story_speech.py', 'Integrations/test_story_speech.py'}
          REVIEWED_CHANGED={'.github/workflows/free-production.yml', 'Integrations/examples/README.md'}
          PROTECTED_COUNT=289
          PROTECTED_SHA256='fe72d080bad622c3946479106dda0abe7be7ca596f9e96a5800a424ed9b954b7'
          assert len(ADDITIONS)==2 and not ADDITIONS & REVIEWED_CHANGED
          assert ADDITIONS<=set(rows) and REVIEWED_CHANGED<=set(rows)
          protected={name:value for name,value in rows.items() if name not in (REVIEWED_CHANGED | ADDITIONS)}
          digest_input=''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected)==PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest()==PROTECTED_SHA256
          print('manifest_payloads=293 unchanged_protected_inputs=289 source_commit='+head)
          print('protected_baseline_commit='+BASE_PUBLIC_COMMIT+' reused_core_and_legacy_author_run=41191732445 blanket_native_reuse=false')
          PYCODE

      - name: Verify the fifteen complete original voice timing rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import sys, unittest
          sys.path.insert(0, 'Integrations')
          suite=unittest.defaultTestLoader.discover('Integrations', pattern='test_story_speech.py')
          assert suite.countTestCases()==15,'Exact new literal timing rule inventory changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==15 and not result.skipped, 'A new timing rule failed, skipped or was not executed'
          print('current_story_speech_literal_rules=15 sdk_executed=false audio_decoded=false human_review=false')
          PYCODE

      - name: Build the current standalone free CLI
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-free-paper-explanation'
          log=Path(os.environ['RUNNER_TEMP'])/'video-free-paper-explanation-build.log'
          try:
              with log.open('wb') as stream:
                  result=subprocess.run(['swift','build','--package-path',str(root),'--scratch-path',str(scratch),'--disable-sandbox','--jobs','2','-c','release','--product','video'],stdout=stream,stderr=subprocess.STDOUT,timeout=1500)
              lines=log.read_text(errors='replace').splitlines()
              errors=[line[:700] for line in lines if re.search(r'error:|fatal error:',line,re.I)]
              print('build_errors='+str(len(errors)))
              for line in errors[-12:]:print(line)
              assert result.returncode==0,'Current standalone free CLI failed to build'
              directory=subprocess.check_output(['swift','build','--package-path',str(root),'--scratch-path',str(scratch),'-c','release','--show-bin-path'],text=True).strip()
              binary=(Path(directory)/'video').resolve(strict=True)
              with Path(os.environ['GITHUB_ENV']).open('a') as stream:stream.write('VIDEO_FREE_BINARY='+str(binary)+'\n')
              print('current_native_build=passed cli_sha256='+hashlib.sha256(binary.read_bytes()).hexdigest())
          finally:log.unlink(missing_ok=True)
          PYCODE

      - name: Exercise the unchanged delivery author through the current standalone CLI
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os, subprocess, sys
          from pathlib import Path
          delivery=subprocess.run([sys.executable,'-B','Integrations/knowledge_story_smoke.py',
              '--binary',os.environ['VIDEO_FREE_BINARY'],'--output',str(Path(os.environ['RUNNER_TEMP'])/'knowledge-delivery-normal-cli'),'--delivery'],
              text=True,capture_output=True,timeout=120)
          print(delivery.stdout,end='')
          if delivery.stderr:print(delivery.stderr,file=sys.stderr,end='')
          assert delivery.returncode==0,'Actual delivery-before-payment normal author chain failed'
          assert delivery.stdout.startswith('knowledge_story_smoke: passed (32 actual normal CLI calls; delivery=v1; '), 'Exact delivery call inventory differs'
          PYCODE

      - name: Record exact evidence boundaries
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os
          text=("Current public CLI was rebuilt and the unchanged delivery author executed 32 actual normal CLI calls, including its Core recording, dependency refusals, CAS, no-op and independent backup recovery. "
                "The 15 new story_speech rules used explicitly synthetic literal timing inputs; they did not run the SDK, decode audio or validate an actual voice take. "
                "The protected 289 payloads are byte-identical to public baseline b114079889f914ab36c95d2ccae3868d615ca613. Its successful run 41191732445 supplies the unchanged 30-method Core causal class, 28-call v1 author and 30-call cost-v2 author evidence; those were not rerun or counted as current passes. "
                "The unchanged 50 Python rules retain their original successful run 41190009527 as already carried by baseline run 41191732445. Layout, ReadAloud service calls, paper media and advanced painters retain their original evidence and were not rerun. "
                "Actual new voice/media integration is separately verified in its private production environment; this public run grants no real voice, subtitle, material rights or whole-film human approval. "
                "No private art, advanced implementation, original business audio or credentials were published.\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:stream.write(text)
          print('current_native_build=passed current_story_speech_literal_rules=15 current_delivery_cli_calls=32 current_causal_native_rules=0 reused_causal_native_rules=30 current_legacy_v1_cost_v2_calls=0 media_executed=false review=false')
          PYCODE
