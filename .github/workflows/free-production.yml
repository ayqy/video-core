name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-production:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source and fresh environment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, platform, plistlib, re, subprocess
          root = Path(os.environ['GITHUB_WORKSPACE'])
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          assert head == os.environ['VIDEO_SOURCE_COMMIT']
          manifest = (root / 'SOURCE-MANIFEST.md').read_text()
          rows = re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$', manifest)
          names = {name for digest, size, name in rows}
          assert len(rows) == len(names) and rows
          for digest, size, name in rows:
              relative = Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              data = (root / relative).read_bytes()
              assert len(data) == int(size) and hashlib.sha256(data).hexdigest() == digest, name
          metadata = {'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html',
                      'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked = set(subprocess.check_output(['git', 'ls-files'], cwd=root, text=True).splitlines())
          assert tracked == names | metadata | {'SOURCE-MANIFEST.md'}
          assert not any((root / name).exists() for name in ['MacApp', 'App', 'Premium',
              'Sources/VideoGame', 'Sources/VideoCartoon', 'Sources/VideoAdvanced'])
          apps = []
          for base in [Path('/Applications'), Path('/System/Applications'), Path.home() / 'Applications']:
              if base.exists():
                  for app in base.rglob('*.app'):
                      info = app / 'Contents/Info.plist'
                      if info.is_file():
                          value = plistlib.loads(info.read_bytes())
                          if value.get('CFBundleIdentifier') in {'com.ayqy.video.mac', 'com.ayqy.video'}:
                              apps.append(str(app))
          assert not apps, 'Video App is installed'
          assert not (Path.home() / 'Library/Containers/com.ayqy.video.mac').exists()
          process = subprocess.check_output(['ps', '-axo', 'comm='], text=True)
          assert not any('/VideoMac.app/' in line or '/知幕.app/' in line for line in process.splitlines())
          for base in [root, Path.home() / 'Library/Application Support/Video', Path.home() / '.video']:
              if base.exists():
                  assert not list(base.rglob('*.videolicense'))
                  assert not list(base.rglob('*.videoplugin'))
                  assert not list(base.rglob('render-catalog*.videomodules'))
          print('clean_environment=verified; app=absent; paid_module=absent; activation=not_supplied')
          print('source_commit=' + head + '; manifest_payloads=' + str(len(rows)))
          print('system=' + platform.platform() + '; architecture=' + platform.machine())
          print('image=' + os.environ.get('ImageOS', 'unknown') + '; image_version=' + os.environ.get('ImageVersion', 'unknown'))
          PY

      - name: Check offline narration adapter rules
        shell: bash
        run: |
          python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('Integrations/tests', pattern='test_expressive_tts.py')
          count = suite.countTestCases()
          assert count >= 22, 'Expected the complete narration adapter rule suite, including instruction boundaries'
          print('expressive_tts_distinct_rules=' + str(count))
          print('model_download=not_run; inference=not_run; voice_quality=needs_review')
          PY
          python3 -B -m unittest discover -s Integrations/tests -p test_expressive_tts.py
          python3 -B Integrations/expressive_tts.py --help
          python3 -B Integrations/prepare_cosyvoice.py --help

      - name: Check complete shared Skill and host permission rules
        shell: bash
        run: |
          python3 -B - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'Integrations')
          modules = ['test_codex_events', 'test_codex_broker', 'test_codex_production',
                     'test_qwen_stream', 'test_claude_stream', 'check_install', 'test_discover']
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in modules)
          def identities(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from identities(item)
                  else:
                      yield item.id()
          expected = list(identities(suite))
          assert expected and len(expected) == len(set(expected)) == suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.wasSuccessful() and result.testsRun == len(expected) and not result.skipped
          print('complete_host_rule_methods=' + str(len(expected)))
          print('model_request=not_run; account_change=not_run; full_host_acceptance=needs_review')
          PY
          python3 -B Integrations/check_package.py

      - name: Prepare normal media tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
          swift --version

      - name: Build the standalone free CLI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root = Path(os.environ['GITHUB_WORKSPACE'])
          scratch = Path(os.environ['RUNNER_TEMP']) / 'video-free-build'
          log = Path(os.environ['RUNNER_TEMP']) / 'video-free-build.log'
          result = None
          try:
              with log.open('wb') as stream:
                  result = subprocess.run(['swift', 'build', '--package-path', str(root),
                      '--scratch-path', str(scratch), '--disable-sandbox', '--jobs', '2',
                      '-c', 'release', '--product', 'video'], stdout=stream,
                      stderr=subprocess.STDOUT, timeout=1500)
              lines = log.read_text(errors='replace').splitlines()
              errors = [line[:700] for line in lines if re.search(r'error:|fatal error:', line, re.I)]
              warnings = [line for line in lines if 'warning:' in line]
              print('build_warnings=' + str(len(warnings)) + '; build_errors=' + str(len(errors)))
              for line in errors[-12:]:
                  print(line)
              assert result.returncode == 0, 'Free CLI build failed'
              directory = subprocess.check_output(['swift', 'build', '--package-path', str(root),
                  '--scratch-path', str(scratch), '-c', 'release', '--show-bin-path'], text=True).strip()
              binary = (Path(directory) / 'video').resolve(strict=True)
              print('cli_sha256=' + hashlib.sha256(binary.read_bytes()).hexdigest())
              with Path(os.environ['GITHUB_ENV']).open('a') as stream:
                  stream.write('VIDEO_FREE_BINARY=' + str(binary) + '\n')
          finally:
              log.unlink(missing_ok=True)
          PY

      - name: Check affected speech, provider, mixing and practice rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          root = Path(os.environ['GITHUB_WORKSPACE'])
          scratch = Path(os.environ['RUNNER_TEMP']) / 'video-free-build'
          log = Path(os.environ['RUNNER_TEMP']) / 'video-free-rules.log'
          # Each full suite is reviewed against its exact source inventory.
          # The import-only selection must not run installed-system TTS on CI.
          suites = {
              ('VideoCoreTests', 'BaiduVideoRulesTests'): (14, None),
              ('VideoCoreTests', 'EditorPracticeTests'): (13, None),
              ('VideoCoreTests', 'MacCommerceRulesTests'): (8, None),
              ('VideoCoreTests', 'SpeechTests'): (34, None),
              ('VideoCoreTests', 'AudioMixRulesTests'): (14, None),
              ('VideoCoreTests', 'ContentServiceRulesTests'): (18, None),
              ('VideoCoreTests', 'ContentProjectTests'): (23, None),
              ('VideoCoreTests', 'ProductionExportTests'): (19, None),
              ('VideoCoreTests', 'ProductionDeliveryTests'): (13, None),
              ('VideoCoreTests', 'BrandDeliveryTests'): (10, None),
              ('VideoCoreTests', 'AgentMutationTests'): (9, None),
              ('VideoCoreTests', 'SpeechProjectRulesTests'): (12, None),
              ('VideoCoreTests', 'ProviderRulesTests'): (14, None),
              ('VideoCoreTests', 'ProductFactsTests'): (20, None),
              ('VideoMediaTests', 'AudioMixMediaTests'): (7, None),
              ('VideoMediaTests', 'ScriptJobsTests'): (22, None),
              ('VideoCoreTests', 'AgentJobAccessTests'): (9, None),
              ('VideoCoreTests', 'JobOperationTests'): (17, None),
              ('VideoCoreTests', 'AgentWorkerTests'): (6, None),
              ('VideoCoreTests', 'AgentContractTests'): (11, None),
              ('VideoCoreTests', 'AgentPreviewTests'): (11, None),
              ('VideoMediaTests', 'BaiduVideoProviderTests'): (21, None),
              ('VideoMediaTests', 'SpeechProjectProductionTests'): (5, (
                  'testNormalImportedAudioAttachChecksRealBytesAndKeepsHumanReviewPending',
                  'testImported22050AudioKeepsContainerTailAndChecksMacCommitAfterDecode')),
              ('VideoMediaTests', 'SpeechMediaTests'): (4, (
                  'testReadsActualStereoAudioWithoutCancellingOppositePhaseOrInventingLoudness',
                  'testRendererRejectsIncompleteHistoricalVoiceBeforeCreatingOutput')),
          }
          method_counts = {}
          expected_methods = set()
          filters = []
          for (target, suite), (source_count, selection) in suites.items():
              source_name = 'ContentProjectTests.swift' if suite in {'ContentProjectTests', 'ProductFactsTests'} else suite + '.swift'
              source = (root / 'Tests' / target / source_name).read_text()
              if suite in {'ContentProjectTests', 'ProductFactsTests'}:
                  declaration = re.search(r'(?m)^final class ' + re.escape(suite) + r'\s*:\s*XCTestCase\s*\{', source)
                  assert declaration, suite + ' declaration missing'
                  source = source[declaration.end():]
                  following = re.search(r'(?m)^(?:final )?class \w+\s*:', source)
                  if following:
                      source = source[:following.start()]
              methods = re.findall(r'(?m)^[ \t]*(?:@\w+(?:\([^\n)]*\))?[ \t]+)*func[ \t]+(test\w+)[ \t]*\(', source)
              assert len(methods) == len(set(methods)) == source_count, (target, suite, methods)
              selected = list(selection) if selection is not None else methods
              assert selected and len(selected) == len(set(selected)) and set(selected) <= set(methods), suite
              method_counts[target + '.' + suite] = len(selected)
              expected_methods.update((target, suite, method) for method in selected)
              filters.append('^' + re.escape(target) + r'\.' + re.escape(suite) +
                             '/(?:' + '|'.join(re.escape(method) for method in selected) + ')$')
          expected = len(expected_methods)
          assert expected == sum(method_counts.values()) == 329
          print('affected_suite_methods=' + str(method_counts))
          print('system_tts_methods=not_selected; import_only_methods=2')
          try:
              executable = Path(os.environ['VIDEO_FREE_BINARY']).resolve(strict=True)
              environment = dict(os.environ, VIDEO_TEST_CLI=str(executable))
              with log.open('wb') as stream:
                  result = subprocess.run(['swift', 'test', '--package-path', str(root),
                      '--scratch-path', str(scratch), '--disable-sandbox', '--jobs', '2',
                      '-c', 'release', '--filter', '|'.join(filters)],
                      stdout=stream, stderr=subprocess.STDOUT, timeout=900, env=environment)
              lines = log.read_text(errors='replace').splitlines()
              errors = [line[:700] for line in lines if re.search(r'error:|fatal error:', line, re.I)]
              for line in errors[-12:]:
                  print(line)
              for line in lines:
                  if re.search(r'Executed \d+ tests?|Test Suite .* (passed|failed)', line):
                      print(line[:700])
              assert result.returncode == 0, 'Affected speech/provider/mixing/practice rules failed'
              # Check actual per-method starts and passes, not a coincidentally
              # equal summary count. Handle the Darwin and dotted XCTest names.
              case_pattern = re.compile(
                  r"^Test Case '(?:-\[(?:(?P<objc_target>\w+)\.)?(?P<objc_suite>\w+) "
                  r"(?P<objc_method>test\w+)\]|(?:(?P<swift_target>\w+)\.)?"
                  r"(?P<swift_suite>\w+)\.(?P<swift_method>test\w+))' "
                  r"(?P<event>started|passed|failed|skipped)\b")
              started, passed = [], []
              for line in lines:
                  match = case_pattern.match(line)
                  if match is None:
                      assert not (line.startswith("Test Case '") and
                                  re.search(r"' (started|passed|failed|skipped)\b", line)), line[:700]
                      continue
                  suite = match['objc_suite'] or match['swift_suite']
                  method = match['objc_method'] or match['swift_method']
                  target = match['objc_target'] or match['swift_target']
                  if target is None:
                      candidates = {item[0] for item in expected_methods if item[1:] == (suite, method)}
                      assert len(candidates) == 1, (suite, method)
                      target = candidates.pop()
                  identity = (target, suite, method)
                  assert identity in expected_methods, ('Unexpected test executed', identity)
                  if match['event'] == 'started':
                      started.append(identity)
                  elif match['event'] == 'passed':
                      passed.append(identity)
                  else:
                      raise AssertionError(('Test did not pass', identity, match['event']))
              assert len(started) == expected and set(started) == expected_methods, ('Missing/duplicate starts', sorted(expected_methods - set(started)))
              assert len(passed) == expected and set(passed) == expected_methods, ('Missing/duplicate passes', sorted(expected_methods - set(passed)))
              counts = [int(value) for value in re.findall(r'Executed (\d+) tests?', '\n'.join(lines))]
              assert expected in counts, 'Affected rule execution did not cover all declared methods'
              print('affected_rules=passed; distinct_tests=' + str(expected))
          finally:
              log.unlink(missing_ok=True)
          PY

      - name: Install and discover the shared Skill files
        shell: bash
        run: |
          python3 Integrations/install.py --host codex --destination "$RUNNER_TEMP/video-project/.agents/skills/video"
          python3 Integrations/install.py --host codex --destination "$RUNNER_TEMP/video-project/.agents/skills/video" --verify
          python3 Integrations/discover.py --binary "$VIDEO_FREE_BINARY"
          python3 Integrations/narration_reference.py --check

      - name: Produce and restore a normal complete video
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess, sys
          temporary = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          binary = Path(os.environ['VIDEO_FREE_BINARY'])
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          subprocess.run([sys.executable, '-B', 'Integrations/examples/free_production.py',
              '--binary', str(binary), '--binary-sha256', digest,
              '--output', str(temporary / 'video-first-production'),
              '--cache', str(temporary / 'free-production-cache')], check=True, timeout=900)
          PY

      - name: Keep the bounded quality handoff
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          report = Path(os.environ['RUNNER_TEMP']) / 'video-first-production/summary.md'
          text = report.read_text()
          assert 0 < len(text.encode()) < 64000
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(text)
          print(text)
          print('free_production=passed; quality_handoff=needs_review; app_activation=not_used')
          PY
