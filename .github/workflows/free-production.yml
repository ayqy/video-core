name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scene-layout-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact current payload and protected baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',(root/'SOURCE-MANIFEST.md').read_text())
          rows={name:(digest,int(size)) for digest,size,name in entries}
          assert len(entries)==len(rows)==296
          for name,(digest,size) in rows.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          metadata={'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(rows)|metadata|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          BASE_PUBLIC_COMMIT='85f818d2ed56ec430d792b051d185d2d99bceaab'
          ADDITIONS=set()
          REVIEWED_CHANGED={'.github/workflows/free-production.yml', 'README.md', 'Integrations/scene_layout.py', 'Integrations/test_scene_layout.py'}
          PROTECTED_COUNT=292
          PROTECTED_SHA256='3f1f9e8130d1a6ab3126e7ace96cb37aa56e2c98f492b7c3fde4a7b9eaad4c04'
          assert not ADDITIONS and len(REVIEWED_CHANGED)==4 and REVIEWED_CHANGED<=set(rows)
          protected={name:value for name,value in rows.items() if name not in REVIEWED_CHANGED}
          digest_input=''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected)==PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest()==PROTECTED_SHA256
          print('manifest_payloads=296 unchanged_protected_inputs=292 source_commit='+head)
          print('protected_baseline_commit='+BASE_PUBLIC_COMMIT+' historical_native_actor_release_run=41203531757 current_scene_layout_checks=pending')
          PYCODE

      - name: Execute the seven affected scene layout rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import sys, unittest
          sys.path.insert(0, 'Integrations')
          suite=unittest.defaultTestLoader.discover('Integrations', pattern='test_scene_layout.py')
          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):yield from cases(item)
                  else:yield item
          expected={
              'test_network_builder_accepts_different_cast_size_and_connects_every_declared_need',
              'test_arbitrary_place_names_have_real_connected_routes_and_a_shared_cut',
              'test_motion_is_arc_length_continuous_exact_at_ends_and_still_transfers_remain_still',
              'test_profile_maps_layer_action_waypoints_and_road_width_without_touching_sources_or_causes',
              'test_transparent_logical_subject_keeps_legal_size_and_projects_position_reversibly',
              'test_visible_small_layer_rejects_before_native_with_its_actual_identity',
              'test_visible_enlargement_cannot_exceed_native_maximum_size',
          }
          expected={'test_scene_layout.SceneLayoutTests.'+name for name in expected}
          identities=[case.id() for case in cases(suite)]
          assert len(identities)==len(set(identities))==suite.countTestCases()==7
          assert set(identities)==expected, 'Exact scene layout rule inventory changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==7 and not result.skipped and not result.expectedFailures
          for identity in sorted(identities):print('scene_layout_passed='+identity)
          print('current_scene_layout_rules=7 current_native_rules=0 current_actor_motion_rules=0 current_release_builds=0 media_executed=false human_review=false')
          PYCODE

      - name: Record exact evidence boundaries
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os
          text=("Current scope actually executes exactly seven scene_layout rules using literal layer, route and projection metadata, with exact identities and no skips or expected failures. "
                "They cover permanent zero-opacity logical layers retaining legal dimensions during reversible projection, visible undersized or oversized layers failing before a native edit, and the existing layout geometry contract. "
                "The other 292 payloads remain byte-identical to public baseline 85f818d2ed56ec430d792b051d185d2d99bceaab. Its 13 actor metadata rules, 12 native image-flip/RPC methods and ordinary Release CLI build are historical run 41203531757 only: they are not rerun or counted as current passes. "
                "Story speech 15 and normal delivery 32 remain historical run 41196437622; causal Core 30 and v1/cost-v2 author evidence remain historical run 41191732445; the older Python 50 remain historical run 41190009527. "
                "This workflow does not build native products, execute media, call TTS, read private business assets or credentials, or grant whole-film, sound, rights or human-review approval.\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:stream.write(text)
          print('current_scene_layout_rules=7 current_native_rules=0 current_actor_motion_rules=0 current_release_builds=0 historical_native_actor_release_run=41203531757 real_business_media_executed=false review=false')
          PYCODE
