name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact current payload and protected baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',(root/'SOURCE-MANIFEST.md').read_text())
          rows={name:(digest,int(size)) for digest,size,name in entries}
          assert len(entries)==len(rows)==309
          for name,(digest,size) in rows.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          metadata={'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(rows)|metadata|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          BASE_PUBLIC_COMMIT='8cc76071b3de425d6e1670c7c787d4eded235550'
          ADDITIONS=set()
          REVIEWED_CHANGED={
              '.github/workflows/free-production.yml',
              'Integrations/README.md',
              'Integrations/knowledge_story.py',
              'Integrations/production_workflow.py',
              'Integrations/story_action.py',
              'Integrations/test_knowledge_story.py',
              'Integrations/test_production_styles.py',
              'Integrations/test_production_workflow.py',
              'Integrations/test_story_action.py',
              'Sources/VideoCore/AgentSchemas.swift',
              'Sources/VideoCore/StoryCausalSources.swift',
              'Tests/VideoCoreTests/StoryCausalSourcesTests.swift',
          }
          PROTECTED_COUNT=297
          PROTECTED_SHA256='66685f166661d1aebbbb313564d4faa0fa22b1f23a47712ecb79f362ee357a8b'
          assert len(ADDITIONS)==0 and len(REVIEWED_CHANGED)==12 and not ADDITIONS&REVIEWED_CHANGED
          assert ADDITIONS|REVIEWED_CHANGED<=set(rows)
          protected={name:value for name,value in rows.items() if name not in ADDITIONS|REVIEWED_CHANGED}
          digest_input=''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected)==PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest()==PROTECTED_SHA256
          print('manifest_payloads=309 added_public_inputs=0 changed_reviewed_inputs=12 unchanged_protected_inputs=297 source_commit='+head)
          print('protected_baseline_commit='+BASE_PUBLIC_COMMIT+' current_knowledge_production_checks=pending')
          PYCODE

      - name: Execute only the affected knowledge production rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import sys, unittest
          sys.path.insert(0, 'Integrations')
          modules=('test_production_workflow', 'test_production_document', 'test_presenter_composition', 'test_sdk_material_import', 'test_production_styles', 'test_scene_layout', 'test_knowledge_story', 'test_story_action')
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in modules)
          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):yield from cases(item)
                  else:yield item
          expected={
              'test_knowledge_story.KnowledgeStoryTests.test_actual_presentation_dry_cas_and_refreshed_plan_are_idempotent',
              'test_knowledge_story.KnowledgeStoryTests.test_apply_verifies_real_source_project_revision_scene_and_persisted_trace',
              'test_knowledge_story.KnowledgeStoryTests.test_arbitrary_native_sources_generate_owned_flows_states_and_routes',
              'test_knowledge_story.KnowledgeStoryTests.test_balance_comes_from_the_actual_actor_and_merges_existing_update',
              'test_knowledge_story.KnowledgeStoryTests.test_both_transfer_endpoints_and_deposit_source_are_owned',
              'test_knowledge_story.KnowledgeStoryTests.test_corrupt_or_partial_sources_and_wrong_final_balances_are_rejected',
              'test_knowledge_story.KnowledgeStoryTests.test_cost_is_explicit_v2_only_mutually_exclusive_and_not_a_noop',
              'test_knowledge_story.KnowledgeStoryTests.test_cost_source_cannot_smuggle_any_other_model_or_wire_change',
              'test_knowledge_story.KnowledgeStoryTests.test_detail_dependencies_cannot_be_dropped_by_removing_beat_requires',
              'test_knowledge_story.KnowledgeStoryTests.test_each_story_detail_and_each_shot_use_must_have_a_real_compiled_beat',
              'test_knowledge_story.KnowledgeStoryTests.test_incorrect_native_state_and_false_outcome_are_rejected',
              'test_knowledge_story.KnowledgeStoryTests.test_matched_rule_without_applied_transfer_cannot_show_money',
              'test_knowledge_story.KnowledgeStoryTests.test_native_presentation_rejects_before_real_cas',
              'test_knowledge_story.KnowledgeStoryTests.test_native_source_failure_stops_before_mutation_or_fabrication',
              'test_knowledge_story.KnowledgeStoryTests.test_old_models_unsafe_trade_and_rule_change_branches_are_explicitly_rejected',
              'test_knowledge_story.KnowledgeStoryTests.test_one_actual_transfer_cannot_be_claimed_twice',
              'test_knowledge_story.KnowledgeStoryTests.test_pencil_reuses_the_same_actions_without_a_game_or_second_interpreter',
              'test_knowledge_story.KnowledgeStoryTests.test_recording_uses_one_normal_dry_cas_then_exact_query_and_compare',
              'test_knowledge_story.KnowledgeStoryTests.test_requested_but_unfunded_action_is_not_a_performed_action',
              'test_knowledge_story.KnowledgeStoryTests.test_requested_only_rejections_and_diagnostic_order_are_not_behavior',
              'test_knowledge_story.KnowledgeStoryTests.test_same_source_movement_must_continue_and_cross_source_reset_is_not_implicit',
              'test_knowledge_story.KnowledgeStoryTests.test_source_identity_readback_does_not_replace_native_presentation_validation',
              'test_knowledge_story.KnowledgeStoryTests.test_source_project_is_separate_and_frozen_before_any_native_call',
              'test_knowledge_story.KnowledgeStoryTests.test_source_time_cannot_go_backwards_without_explicit_dependencies',
              'test_knowledge_story.KnowledgeStoryTests.test_speak_rejects_missing_or_overlong_actual_model_labels',
