name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify bounded shadow-style changes against the passed immutable 348-source public baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          BASE='b4cc8df86afa14859bc8bca9632964adc8816a99'
          REVIEWED={'Tests/VideoCoreTests/PluginProtocolTests.swift', 'Tests/VideoCoreTests/PluginPackageTests.swift', 'Tests/VideoCoreTests/ModelSceneContractTests.swift', '.github/workflows/free-production.yml', 'Tests/VideoCoreTests/PluginModelBankTests.swift', 'Sources/VideoCore/ModelSceneContract.swift', 'Sources/VideoCore/PluginProtocol.swift', 'Tests/VideoCoreTests/AgentSchemasTests.swift', 'Sources/VideoCore/AgentSchemas.swift', 'Tests/VideoCoreTests/VendorFreeModuleTrustTests.swift', 'Sources/VideoCore/VendorFreeModuleTrust.swift'}
          ADDED=set()
          METADATA=set(['.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'])
          FONT_FILES={'Sources/VideoMedia/CoverTypeface.swift': (2197018, 'cf4f47e54fb55606755e65b1f837697edca6ac3bd8f3a67497ebea9514bfb82d'), 'ThirdParty/Fonts/SmileySans/SmileySans-Oblique.ttf': (2629764, 'b447d7e781f08bc95c4c9f23ba71ed2b8ebb639aa7184485c71c4ca5afcd25c4'), 'Sources/VideoMedia/CoverDisplayTypeface.swift': (1564881, '8e2500a885e85ea6f28faa3dd36ce6c860b8d2c216089832cb4616e2e92783b8'), 'ThirdParty/Fonts/DouyinSans/DouyinSansBold.ttf': (1919404, 'fbecfacdfac33982774e301073a8d357a09c698cd3134bb6ddec0f5bfc268fa1')}
          FONT_LICENSES={'ThirdParty/Fonts/SmileySans/LICENSE': (4422, '9401f4050f1b66c26b6ccdc8b0e14a3c1cc37aac122eda84386f25854a9bec72'), 'ThirdParty/Fonts/DouyinSans/LICENSE': (4455, 'a6d5700a002ea32bcfbe3310253d603997683dac8ac63777e375d06c07c30ea6')}
          def parse(raw):
              entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',raw)
              result={name:(digest,int(size)) for digest,size,name in entries}
              assert entries and len(result)==len(entries)
              return result
          def fingerprint(value):
              return hashlib.sha256(''.join(f'{name}\0{value[name][0]}\0{value[name][1]}\n' for name in sorted(value)).encode()).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()==os.environ['VIDEO_SOURCE_COMMIT']
          manifest=(root/'SOURCE-MANIFEST.md').read_text()
          current=parse(manifest)
          assert len(current)==348
          for name,(digest,size) in current.items():
              relative=Path(name);path=root/relative
              assert str(relative)==name and not relative.is_absolute() and '..' not in relative.parts and '\\' not in name
              assert path.is_file() and not any(p.is_symlink() for p in (path,*path.parents))
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
              if name in FONT_FILES: assert (size,digest)==FONT_FILES[name]
              elif name in FONT_LICENSES: assert (size,digest)==FONT_LICENSES[name]
              else: assert 0<size<=2*1024*1024
          assert sum(size for size,_ in FONT_FILES.values())==8311067
          assert sum(current[name][1] for name in FONT_FILES)==8311067
          assert sum(size for name,(_,size) in current.items() if name not in FONT_FILES)<=8*1024*1024
          notice=b'\n'.join(line.rstrip() for line in (root/'NOTICE').read_bytes().splitlines())
          assert all(b'\n'.join(line.rstrip() for line in (root/name).read_bytes().splitlines()) in notice for name in FONT_LICENSES)
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(current)|METADATA|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          assert not any(name.lower().endswith(('.wav','.mp3','.png','.jpg','.jpeg','.webp','.dae','.zip')) for name in tracked)
          assert {name for name in tracked if name.lower().endswith(('.ttf','.otf'))}=={'ThirdParty/Fonts/SmileySans/SmileySans-Oblique.ttf','ThirdParty/Fonts/DouyinSans/DouyinSansBold.ttf'}
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',BASE],cwd=root,check=True,timeout=60,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          raw=subprocess.check_output(['git','show',BASE+':SOURCE-MANIFEST.md'],cwd=root)
          assert hashlib.sha256(raw).hexdigest()=='dda1e772df5a6520991e9390cf72812a4e621b2c4fcbd006c1b475fd45dcbe7a'
          baseline=parse(raw.decode())
          assert len(baseline)==348 and fingerprint(baseline)=='85e6dcdc2268c09661d5b2ce84d5eb3dacb2bd97d2f219acb7095b27a06f2754'
          assert not set(baseline)&ADDED and not REVIEWED&ADDED
          assert set(current)==set(baseline)|ADDED and set(baseline)-set(current)==set()
          assert {name for name in baseline if current[name]!=baseline[name]}==REVIEWED
          unchanged={name:item for name,item in baseline.items() if name not in REVIEWED}
          assert len(unchanged)==337 and fingerprint(unchanged)=='f4ea4059673bd1515ad2a1db91c163ce53905aba7f894aa27ee59d76bfed4bce'
          assert all(current[name]==item for name,item in unchanged.items())
          assert all((root/name).read_bytes()==subprocess.check_output(['git','show',BASE+':'+name],cwd=root) for name in METADATA)
          assert '整体内容指纹：`'+fingerprint(current)+'`' in manifest
          assert not any(name.endswith('.py') or name=='Package.swift' for name in REVIEWED|ADDED)
          print('public_payloads=348 direct_baseline_payloads=348 additions=0 removals=0 reviewed_changed='+str(len(REVIEWED))+' unchanged='+str(len(unchanged)))
          print('current_payload_sha256='+fingerprint(current)+' unchanged_sha256='+fingerprint(unchanged))
          print('unchanged_python_recipe_and_cover_evidence_reused=true source_baseline='+BASE)
          PYCODE

