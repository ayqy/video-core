name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact current payload and protected baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',(root/'SOURCE-MANIFEST.md').read_text())
          rows={name:(digest,int(size)) for digest,size,name in entries}
          assert len(entries)==len(rows)==309
          for name,(digest,size) in rows.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          metadata={'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(rows)|metadata|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          BASE_PUBLIC_COMMIT='a10f360fa996bb1fe01601af233e4807fee7b183'
          ADDITIONS=set()
          REVIEWED_CHANGED={
              '.github/workflows/free-production.yml', 'Integrations/README.md',
              'Integrations/production_workflow.py', 'Integrations/test_production_workflow.py',
          }
          PROTECTED_COUNT=305
          PROTECTED_SHA256='ca4ddfe64973f945d852385f30ce65027c62151defa0d74757d1c13370d33e1c'
          assert len(ADDITIONS)==0 and len(REVIEWED_CHANGED)==4 and not ADDITIONS&REVIEWED_CHANGED
          assert ADDITIONS|REVIEWED_CHANGED<=set(rows)
          protected={name:value for name,value in rows.items() if name not in ADDITIONS|REVIEWED_CHANGED}
          digest_input=''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected)==PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest()==PROTECTED_SHA256
          print('manifest_payloads=309 added_public_inputs=0 changed_reviewed_inputs=4 unchanged_protected_inputs=305 source_commit='+head)
          print('protected_baseline_commit='+BASE_PUBLIC_COMMIT+' current_knowledge_production_checks=pending')
          PYCODE

      - name: Execute only the affected knowledge production rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import sys, unittest
          sys.path.insert(0, 'Integrations')
          modules=('test_production_workflow', 'test_production_document',
                   'test_presenter_composition', 'test_sdk_material_import', 'test_production_styles',
                   'test_scene_layout')
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in modules)
          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):yield from cases(item)
                  else:yield item
          expected={
              'test_production_workflow.ArtifactPreservationContracts.test_all_four_identities_are_deeply_preserved_and_existing_equal_bytes_are_idempotent',
              'test_production_workflow.ArtifactPreservationContracts.test_distinct_native_paths_cannot_collide_on_a_persistent_basename',
              'test_production_workflow.ArtifactPreservationContracts.test_foreign_root_escape_leaf_and_parent_symlinks_reject_before_output_creation',
              'test_production_workflow.ArtifactPreservationContracts.test_invalid_late_original_metadata_or_bytes_reject_before_any_output_write',
              'test_production_workflow.ArtifactPreservationContracts.test_last_existing_target_conflicts_and_symlinks_leave_all_other_targets_unwritten',
              'test_production_workflow.ArtifactPreservationContracts.test_workflow_decode_boundary_uses_persisted_mp4_by_mime_without_starting_a_decoder',
              'test_presenter_composition.PresenterCompositionRules.test_actual_frame_table_is_stable_for_the_same_original_across_takes',
              'test_presenter_composition.PresenterCompositionRules.test_arbitrary_actor_material_duration_quantity_and_business_ids_compose',
              'test_presenter_composition.PresenterCompositionRules.test_changed_missing_empty_or_symlink_original_is_rejected',
              'test_presenter_composition.PresenterCompositionRules.test_changed_narration_captions_and_timing_duration_are_not_silently_repaired',
              'test_presenter_composition.PresenterCompositionRules.test_clips_obey_native_mouth_and_frame_contract',
              'test_presenter_composition.PresenterCompositionRules.test_cue_clock_rejects_missing_tail_gaps_overlap_unknown_clip_and_offsets',
              'test_presenter_composition.PresenterCompositionRules.test_energy_cannot_mix_actor_voice_source_text_or_duration',
              'test_presenter_composition.PresenterCompositionRules.test_existing_advanced_scene_trim_speed_or_pause_cannot_be_hidden',
              'test_presenter_composition.PresenterCompositionRules.test_explicit_story_area_is_respected_and_not_exported_as_native_presenter_metadata',
              'test_presenter_composition.PresenterCompositionRules.test_finite_metadata_budgets_reject_excess_sprite_clip_and_cue_counts',
              'test_presenter_composition.PresenterCompositionRules.test_interior_holes_and_overlaps_reject_even_with_matching_head_and_tail',
              'test_presenter_composition.PresenterCompositionRules.test_invalid_portrait_space_or_explicit_story_bounds_reject_before_input_mutation',
              'test_presenter_composition.PresenterCompositionRules.test_material_key_asset_evidence_hash_and_classic_source_must_agree',
              'test_presenter_composition.PresenterCompositionRules.test_minimum_required_material_receipt_works_without_an_extra_frame_manifest',
              'test_presenter_composition.PresenterCompositionRules.test_native_maximum_continuous_rms_budget_is_accepted',
              'test_presenter_composition.PresenterCompositionRules.test_native_maximum_sprite_clip_frame_and_cue_budgets_are_accepted',
              'test_presenter_composition.PresenterCompositionRules.test_nonfinite_bad_typed_or_outside_crop_and_box_reject',
              'test_presenter_composition.PresenterCompositionRules.test_only_shared_layout_geometry_changes_business_actions_and_layers',
              'test_presenter_composition.PresenterCompositionRules.test_portrait_uses_actual_viewport_and_leaves_story_above_bottom_presenter',
              'test_presenter_composition.PresenterCompositionRules.test_presenter_cannot_alias_business_layer_subject_or_target',
              'test_presenter_composition.PresenterCompositionRules.test_prior_shared_layout_is_rebased_without_stale_native_scene_metadata',
              'test_presenter_composition.PresenterCompositionRules.test_profile_requires_all_explicit_contract_fields_and_no_unknown_defaults',
              'test_presenter_composition.PresenterCompositionRules.test_rms_rejects_missing_head_tail_gaps_overlaps_invalid_values_and_phonemes',
              'test_presenter_composition.PresenterCompositionRules.test_scene_voice_captions_sources_title_and_causality_remain_independent',
              'test_presenter_composition.PresenterCompositionRules.test_supplied_clips_cues_box_and_rms_are_not_synthesized_or_retimed',
              'test_presenter_composition.PresenterCompositionRules.test_title_is_metadata_body_empty_and_paper_presentation_removed',
              'test_presenter_composition.PresenterCompositionRules.test_unknown_master_missing_clip_role_and_duplicate_role_or_crop_reject',
              'test_production_document.DocumentTests.test_changed_material_unknown_symbol_and_wrong_narration_reject',
              'test_production_document.DocumentTests.test_conflicting_executor_catalog_rejects_without_a_production_home',
              'test_production_document.DocumentTests.test_foreign_business_claims_captions_and_unknown_fields_reject_before_import',
              'test_production_document.DocumentTests.test_invalid_or_conflicting_story_layout_rejects_before_import',
              'test_production_document.DocumentTests.test_material_voice_cannot_replace_the_reserved_actual_audio_binding',
              'test_production_document.DocumentTests.test_named_exchange_and_cost_intervention_use_one_interface_without_delivery_ids',
              'test_production_document.DocumentTests.test_plain_portrait_layout_uses_complete_motion_and_keeps_business_clock',
              'test_production_document.DocumentTests.test_presenter_portrait_viewport_reaches_the_actual_composer',
              'test_production_document.DocumentTests.test_quantity_and_actor_names_are_model_values_not_a_three_coin_guard',
              'test_production_document.DocumentTests.test_real_material_binding_keeps_declared_source_and_receipt_ids',
              'test_production_document.DocumentTests.test_stage_does_not_stretch_a_voice_axis_or_migrate_review',
              'test_production_document.FrozenSpeechTests.test_changed_original_receipt_is_not_accepted_through_ordinary_axis_proof',
              'test_production_document.FrozenSpeechTests.test_incomplete_observations_reject_even_when_both_saved_copies_match',
              'test_production_document.FrozenSpeechTests.test_mismatched_spoken_shot_axis_rejects_even_when_caption_and_backup_agree',
              'test_production_document.FrozenSpeechTests.test_mixed_job_artifact_revision_or_workspace_reject',
              'test_production_document.FrozenSpeechTests.test_revision_lineage_and_ordinary_production_each_bind_the_same_frozen_axis',
              'test_production_styles.ImporterProvenanceRules.test_exact_importer_source_and_runtime_return_frozen_input_pins',
              'test_production_styles.ImporterProvenanceRules.test_wrong_binary_source_native_stage_or_rule_claim_rejects',
              'test_production_styles.PresenterPreflightRules.test_bad_profile_rejects_before_runtime_or_workspace_writes',
              'test_production_styles.PresenterPreflightRules.test_optional_styles_leave_a_normal_free_declaration_usable',
              'test_production_styles.PresenterPreflightRules.test_over_sixty_second_energy_input_rejects_at_declaration_boundary',
              'test_production_styles.PresenterPreflightRules.test_real_adapter_join_keeps_the_frozen_timed_object_and_business_facts',
              'test_production_styles.ProjectionRules.test_only_mode_anchors_and_existing_balance_subjects_change',
              'test_production_styles.ProjectionRules.test_projection_cannot_inject_sources_story_or_new_observations',
              'test_production_styles.SourceRevisionRules.test_an_existing_recording_cannot_be_replaced_or_removed_on_resume',
              'test_production_styles.SourceRevisionRules.test_foreign_workspace_project_missing_or_duplicate_base_reject',
              'test_production_styles.SourceRevisionRules.test_new_import_requires_the_exact_current_revision',
              'test_production_styles.SourceRevisionRules.test_recording_cannot_hide_model_seed_time_scene_identity_or_branch_changes',
              'test_production_styles.SourceRevisionRules.test_reused_import_survives_normal_recording_successors_without_mutation',
              'test_production_workflow.FrozenInputContracts.test_changed_pinned_bytes_fail_before_even_a_cached_operation',
              'test_production_workflow.FrozenInputContracts.test_extra_helper_or_asset_changes_are_not_controller_upgrades',
              'test_production_workflow.FrozenInputContracts.test_freeze_includes_engine_actual_caller_author_inputs_assets_and_original_speech',
              'test_production_workflow.FrozenInputContracts.test_old_home_missing_the_new_engine_pin_is_never_silently_migrated',
              'test_production_workflow.FrozenInputContracts.test_only_explicit_retained_controller_change_may_upgrade',
              'test_production_workflow.FrozenInputContracts.test_speech_provenance_binds_the_actual_axis_original_inputs_and_same_request_receipt',
              'test_production_workflow.OriginalJobContracts.test_expired_lease_reclaims_and_resumes_only_the_original_job',
              'test_production_workflow.OriginalJobContracts.test_failed_or_interrupted_jobs_resume_before_running_the_same_identity',
              'test_production_workflow.OriginalJobContracts.test_live_original_lease_performs_no_execution_or_replacement',
              'test_production_workflow.OriginalJobContracts.test_missing_lease_is_rejected',
              'test_production_workflow.OriginalJobContracts.test_real_invocation_cache_deduplicates_writes_but_refreshes_status',
              'test_production_workflow.OriginalJobContracts.test_recovery_hook_stops_at_queued_for_an_independently_selected_host_executor',
              'test_production_workflow.OriginalJobContracts.test_render_rejects_a_replacement_job_or_incomplete_deliverable_set',
              'test_production_workflow.OriginalJobContracts.test_repeated_render_preserves_the_original_frozen_quote_and_job',
              'test_production_workflow.SourceObservationContracts.test_a_persisted_partial_reordered_or_wrong_axis_trace_still_fails',
              'test_production_workflow.SourceObservationContracts.test_caller_trace_model_seed_window_or_row_set_cannot_replace_persistent_observations',
              'test_production_workflow.SourceObservationContracts.test_frozen_source_revision_or_workspace_cannot_silently_advance',
              'test_production_workflow.SourceObservationContracts.test_one_or_three_sources_use_their_own_native_time_axis_and_observed_values',
              'test_production_workflow.SpeechAxisHookContracts.test_explicit_presentation_hook_owns_content_and_declared_frame_rate',
              'test_scene_layout.SceneLayoutTests.test_arbitrary_place_names_have_real_connected_routes_and_a_shared_cut',
              'test_scene_layout.SceneLayoutTests.test_invalid_actual_viewport_or_target_bounds_reject_without_mutation',
              'test_scene_layout.SceneLayoutTests.test_motion_is_arc_length_continuous_exact_at_ends_and_still_transfers_remain_still',
              'test_scene_layout.SceneLayoutTests.test_network_builder_accepts_different_cast_size_and_connects_every_declared_need',
              'test_scene_layout.SceneLayoutTests.test_omitted_viewport_preserves_exact_default_profile_projection',
              'test_scene_layout.SceneLayoutTests.test_portrait_explicit_story_box_fits_roads_poses_and_action_geometry_together',
              'test_scene_layout.SceneLayoutTests.test_profile_maps_layer_action_waypoints_and_road_width_without_touching_sources_or_causes',
              'test_scene_layout.SceneLayoutTests.test_repeated_cross_viewport_projection_does_not_accumulate_geometry_drift',
              'test_scene_layout.SceneLayoutTests.test_road_bounds_follow_actual_viewport_and_all_authored_polyline_points',
              'test_scene_layout.SceneLayoutTests.test_transparent_logical_subject_keeps_legal_size_and_projects_position_reversibly',
              'test_scene_layout.SceneLayoutTests.test_visible_enlargement_cannot_exceed_native_maximum_size',
              'test_scene_layout.SceneLayoutTests.test_visible_small_layer_rejects_before_native_with_its_actual_identity',
              'test_sdk_material_import.SyntheticInvocationRules.test_duplicate_json_or_native_rejection_is_not_accepted',
              'test_sdk_material_import.SyntheticInvocationRules.test_symlink_workspace_and_missing_resources_are_rejected_before_invocation',
              'test_sdk_material_import.SyntheticInvocationRules.test_uses_rtk_and_exact_four_explicit_argument_pairs_without_shell',
              'test_sdk_material_import.SyntheticReceiptRules.test_all_fifteen_unique_source_paths_are_required',
              'test_sdk_material_import.SyntheticReceiptRules.test_declaration_cannot_escape_resources_or_alias_another_file',
              'test_sdk_material_import.SyntheticReceiptRules.test_duplicate_normal_records_and_artwork_source_injection_are_rejected',
              'test_sdk_material_import.SyntheticReceiptRules.test_owner_license_and_relative_file_path_are_not_inferred_from_receipt',
              'test_sdk_material_import.SyntheticReceiptRules.test_passive_js_is_text_and_cannot_supply_actual_media',
              'test_sdk_material_import.SyntheticReceiptRules.test_receipt_bindings_must_match_real_assets_and_original_claim',
              'test_sdk_material_import.SyntheticReceiptRules.test_retains_actual_declared_source_owner_license_and_evidence_ids',
              'test_sdk_material_import.SyntheticReceiptRules.test_source_or_evidence_cannot_be_replaced_with_generated_defaults',
              'test_sdk_material_import.SyntheticReceiptRules.test_source_page_must_retain_complete_original_bytes',
              'test_sdk_material_import.SyntheticReceiptRules.test_unknown_or_changed_scope_identity_is_rejected',
          }
          identities=[case.id() for case in cases(suite)]
          assert len(identities)==len(set(identities))==suite.countTestCases()==len(expected)
          assert set(identities)==expected, 'Exact knowledge production rule inventory changed'
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==len(expected) and not result.skipped and not result.expectedFailures
          for identity in sorted(identities):print('knowledge_production_passed='+identity)
          print('current_knowledge_production_rules='+str(len(expected))+' current_artifact_preservation_rules=6 current_native_rules=0 current_scene_layout_rules=12 current_release_builds=0 media_executed=false human_review=false')
          PYCODE

      - name: Record exact evidence boundaries
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os
          text=("Current scope executes exactly 106 declared pure production-workflow, production-document, viewport-layout, presentation-style, image-presenter and SDK-receipt rules, with exact identities and no skips or expected failures. "
                "CLI responses, source traces, runtime receipts, material bytes and RMS in these tests are explicit synthetic observations; they do not establish real Core import, rendering, acoustic measurement, installed publication, rights or whole-film approval. "
                "The reviewed changes share exact native artifact preservation between the production verifier and ordinary callers: all four source receipts and existing destination conflicts are validated before writing persistent copies, equal existing copies are reused, and only copied receipt paths change. This does not inspect media or change a native job, quote, revision, original artifact or review state. Callers retain their own complete source, audio, timing, rights and normal production gates. "
                "The other 305 payloads remain byte-identical to public baseline a10f360fa996bb1fe01601af233e4807fee7b183; four reviewed existing inputs change and no inputs are added. All 100 existing pure rules are retained and rerun by exact identity, including 12 layout rules. Six new artifact-preservation rules use explicit non-media bytes and a mocked decoder boundary; no native product or decoder is started. The private ordinary recipes and their real media are outside this public payload and this CI execution. "
                "The 13 actor metadata rules, 12 native image-flip/RPC methods and ordinary Release CLI build remain historical run 41203531757; they are not rerun or counted as current passes. "
                "Story speech and normal delivery remain historical run 41196437622, causal Core and author evidence remain historical run 41191732445, and older Python evidence remains historical run 41190009527. "
                "This workflow does not build native products, execute business media, call TTS, read private assets or credentials, export closed painters, or grant listening, captions, commercial rights, upload consent or human-review approval.\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:stream.write(text)
          print('current_artifact_preservation_rules=6 current_native_rules=0 current_scene_layout_rules=12 current_actor_motion_rules=0 current_release_builds=0 real_business_media_executed=false review=false')
          PYCODE
