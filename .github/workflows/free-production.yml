name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  game-asset-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source and unchanged native production inputs
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import ast, hashlib, os, re, subprocess, sys
          root = Path(os.environ['GITHUB_WORKSPACE'])
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          assert head == os.environ['VIDEO_SOURCE_COMMIT']
          manifest = (root / 'SOURCE-MANIFEST.md').read_text()
          entries = re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$', manifest)
          rows = {name: (digest, int(size)) for digest, size, name in entries}
          assert len(entries) == len(rows) == 261
          for name, (digest, size) in rows.items():
              relative = Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path = root / relative
              assert not path.is_symlink() and path.is_file()
              assert not any(parent.is_symlink() for parent in path.parents)
              data = path.read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, name
          metadata = {'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html',
                      'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked = set(subprocess.check_output(['git', 'ls-files'], cwd=root, text=True).splitlines())
          assert tracked == set(rows) | metadata | {'SOURCE-MANIFEST.md'}
          assert not any((root / name).exists() for name in ['MacApp', 'App', 'Premium',
              'Sources/VideoGame', 'Sources/VideoCartoon', 'Sources/VideoAdvanced'])
          # This reviewed profile changes only the two new generic Python files,
          # the cache's provenance API/tests, and explanatory publication text.
          # Bind the complete remaining 254 files (including Package.swift, all
          # native source/rules and the real production recipe) to the successful
          # exact public baseline. A changed/new/missing file fails this plan.
          BASE_PUBLIC_COMMIT = '70f68a8735825a11e063e2836693550102549ef2'
          BASE_NATIVE_RUN = '40915484069'
          ADDITIONS = {'Integrations/game_asset_production.py', 'Integrations/test_game_asset_production.py'}
          REVIEWED_CHANGED = ADDITIONS | {'Integrations/asset_reuse.py', 'Integrations/test_asset_reuse.py',
              'Integrations/README.md', '.github/workflows/free-production.yml', 'README.md'}
          PROTECTED_COUNT = 254
          PROTECTED_SHA256 = 'caffd750166a24a7be688c531127642f924f3524bca23f62d96082af979313b4'
          assert ADDITIONS <= set(rows) and REVIEWED_CHANGED <= set(rows)
          protected = {name: value for name, value in rows.items() if name not in REVIEWED_CHANGED}
          digest_input = ''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected) == PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest() == PROTECTED_SHA256, (
              'Native/source dependency scope changed: revise the affected validation plan before reusing evidence')
          # The prior real CLI media/restore recipe imports only the standard
          # library. It neither imports the changed AssetCache nor calls the new
          # provenance API; source-byte equality above fixes this invocation mode.
          recipe = root / 'Integrations/examples/free_production.py'
          tree = ast.parse(recipe.read_text(), filename=str(recipe))
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  assert all(item.name.split('.')[0] in sys.stdlib_module_names for item in node.names)
              elif isinstance(node, ast.ImportFrom):
                  assert node.level == 0 and (node.module or '').split('.')[0] in sys.stdlib_module_names
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  assert node.func.id not in {'__import__', 'eval', 'exec', 'compile'}
          print('source_commit=' + head + '; manifest_payloads=' + str(len(rows)))
          print('unchanged_protected_inputs=' + str(len(protected)) + '; sha256=' + PROTECTED_SHA256)
          print('native_prior_evidence_reused=true; base_public_commit=' + BASE_PUBLIC_COMMIT + '; successful_run=' + BASE_NATIVE_RUN)
          print('current_native_build=false; current_swift_rules=false; current_media_chain=false; recipe_uses_changed_cache=false')
          PYCODE

      - name: Validate complete affected game asset and provenance Python rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from collections import Counter
          import hashlib, json, sys, unittest
          sys.path.insert(0, 'Integrations')
          modules = ['test_game_asset_production', 'test_asset_reuse']
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in modules)
          def identities(node):
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from identities(item)
                  else:
                      yield item.id()
          expected = list(identities(suite))
          assert expected and len(expected) == len(set(expected)) == suite.countTestCases()
          assert all(identity.split('.')[0] in modules for identity in expected)
          assert set(identity.split('.')[0] for identity in expected) == set(modules)
          class ExactResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.started_ids, self.passed_ids = [], []
              def startTest(self, test):
                  self.started_ids.append(test.id())
                  super().startTest(test)
              def addSuccess(self, test):
                  self.passed_ids.append(test.id())
                  super().addSuccess(test)
          result = unittest.TextTestRunner(verbosity=1, resultclass=ExactResult).run(suite)
          assert result.wasSuccessful() and not result.skipped
          assert result.testsRun == len(expected) and result.started_ids == expected and result.passed_ids == expected
          inventory = json.dumps(sorted(expected), ensure_ascii=False, separators=(',', ':')).encode()
          print('affected_python_rules=passed; distinct_test_ids=' + str(len(expected)))
          print('affected_python_modules=' + json.dumps(dict(Counter(name.split('.')[0] for name in expected)), sort_keys=True))
          print('affected_python_test_ids_sha256=' + hashlib.sha256(inventory).hexdigest())
          print('source_selection_rules_only=true; synthetic_rule_pngs=not_production_assets; native_cli_or_render_execution=false')
          print('unchanged_story_speech_host_tts_and_purchase_rules=prior_evidence_reused; model_request=not_run; account_change=not_run')
          PYCODE

      - name: Record this invocation and prior evidence boundaries
        if: success()
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import os
          text = ('Game asset/provenance Python rules passed for this exact public commit.\n\n'
                  'The complete protected native input set matched public 70f68a8735825a11e063e2836693550102549ef2. '
                  'Its successful Free production run 40915484069 supplies the unchanged CLI build, shared Swift rules '
                  'and ordinary complete video/source-restore evidence. Those stages were not repeated here.\n\n'
                  'Real generated originals, normal workspace binding and the trusted game7 media chain require their '
                  'separate current production receipts. Python transport rules and source publication do not grant '
                  'source rights, paid entitlements, speech/caption confirmation or whole-film approval.\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(text)
          print('game_asset_python_scope=passed; native_evidence=verified_reuse; media_quality=needs_review')
          PYCODE
