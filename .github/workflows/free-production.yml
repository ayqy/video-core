name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact371 public payloads and first-frame cover increment
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, os, re, struct, subprocess
          root=Path(os.environ["GITHUB_WORKSPACE"])
          BASE='f6ad22bfd8272f8c682e3a2d14ce48737154ad9a'
          REVIEWED=set(['.github/workflows/free-production.yml', 'README.md', 'Sources/VideoCore/CoverPresentation.swift', 'Sources/VideoMedia/CoverPainter.swift', 'Sources/VideoMedia/Renderer.swift', 'Sources/VideoMedia/VisualCache.swift', 'Tests/VideoMediaTests/ContentProjectMediaTests.swift', 'Tests/VideoMediaTests/DataPresentationPainterTests.swift', 'Tests/VideoMediaTests/MediaTests.swift', 'Tests/VideoMediaTests/VisualCacheResumeTests.swift'])
          ADDED=set()
          FONT_FILES={'Sources/VideoMedia/IslandTypeface.swift': (4868996, 'd2ec2f7edbdee750871f5ae5573a4f712fe7fe90b5460d58cd7347b28f0c8f72'), 'ThirdParty/Fonts/ChillRoundF/ChillRoundF-v3.0.ttf': (6168772, '7dae804b344f7bc1a1c8426b9515e9b54d7baac3e123263d0bae94d0a305a732'), 'Sources/VideoMedia/CoverTypeface.swift': (2197018, 'cf4f47e54fb55606755e65b1f837697edca6ac3bd8f3a67497ebea9514bfb82d'), 'ThirdParty/Fonts/SmileySans/SmileySans-Oblique.ttf': (2629764, 'b447d7e781f08bc95c4c9f23ba71ed2b8ebb639aa7184485c71c4ca5afcd25c4'), 'Sources/VideoMedia/CoverDisplayTypeface.swift': (1564881, '8e2500a885e85ea6f28faa3dd36ce6c860b8d2c216089832cb4616e2e92783b8'), 'ThirdParty/Fonts/DouyinSans/DouyinSansBold.ttf': (1919404, 'fbecfacdfac33982774e301073a8d357a09c698cd3134bb6ddec0f5bfc268fa1')}
          FONT_LICENSES={'ThirdParty/Fonts/ChillRoundF/LICENSE': (4375, 'd45891f8adfd21368c98e803603df1f575ff3fc4a6ec713ba7ccf0e3cba15b28'), 'ThirdParty/Fonts/SmileySans/LICENSE': (4422, '9401f4050f1b66c26b6ccdc8b0e14a3c1cc37aac122eda84386f25854a9bec72'), 'ThirdParty/Fonts/DouyinSans/LICENSE': (4455, 'a6d5700a002ea32bcfbe3310253d603997683dac8ac63777e375d06c07c30ea6')}
          FONT_BINARIES=set(['ThirdParty/Fonts/ChillRoundF/ChillRoundF-v3.0.ttf', 'ThirdParty/Fonts/DouyinSans/DouyinSansBold.ttf', 'ThirdParty/Fonts/SmileySans/SmileySans-Oblique.ttf'])
          FONT_TOTAL=19348835
          METADATA=set(['.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'])
          EXPECTED_COUNT=371
          BASE_MANIFEST_SHA='011d02eeb5dacf49b49aab5aeef816f9528195924f7e35705c5119fd3b8e38d8'
          BASE_FINGERPRINT='55a3b82d39b074209e32887b93247cedce1dab99c63acc7b30d0736ea9f2be5e'
          UNCHANGED_COUNT=361
          UNCHANGED_FINGERPRINT='2326f104da04ace03a7493cd738c74d52c5b554dfabf530c6e40aaf957152133'

          def rows(raw):
              result=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',raw.decode())
              value={name:(digest,int(size)) for digest,size,name in result}
              assert len(value)==len(result)
              return value
          def fingerprint(values):
              return hashlib.sha256(''.join(f'{name}\0{values[name][0]}\0{values[name][1]}\n' for name in sorted(values)).encode()).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()==os.environ['VIDEO_SOURCE_COMMIT']
          manifest=(root/'SOURCE-MANIFEST.md').read_bytes()
          current=rows(manifest)
          assert len(current)==EXPECTED_COUNT
          for name,(digest,size) in current.items():
              relative=Path(name);path=root/relative
              assert str(relative)==name and not relative.is_absolute() and '..' not in relative.parts and '\\' not in name
              assert path.is_file() and not any(p.is_symlink() for p in (path,*path.parents))
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
              if name in FONT_FILES: assert (size,digest)==FONT_FILES[name]
              elif name in FONT_LICENSES: assert (size,digest)==FONT_LICENSES[name]
              else: assert 0<size<=2*1024*1024
          assert sum(size for size,_ in FONT_FILES.values())==FONT_TOTAL
          assert sum(current[name][1] for name in FONT_FILES)==FONT_TOTAL
          assert sum(size for name,(_,size) in current.items() if name not in FONT_FILES)<=8*1024*1024
          notice=b'\n'.join(line.rstrip() for line in (root/'NOTICE').read_bytes().splitlines())
          assert all(b'\n'.join(line.rstrip() for line in (root/name).read_bytes().splitlines()) in notice for name in FONT_LICENSES)
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(current)|METADATA|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          assert not any(name.lower().endswith(('.wav','.mp3','.png','.jpg','.jpeg','.webp','.dae','.zip')) for name in tracked)
          assert {name for name in tracked if name.lower().endswith(('.ttf','.otf'))}==FONT_BINARIES
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',BASE],cwd=root,check=True,timeout=60,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          raw=subprocess.check_output(['git','show',BASE+':SOURCE-MANIFEST.md'],cwd=root)
          assert hashlib.sha256(raw).hexdigest()==BASE_MANIFEST_SHA
          baseline=rows(raw)
          assert len(baseline)==371 and fingerprint(baseline)==BASE_FINGERPRINT
          assert not set(baseline)&ADDED and not REVIEWED&ADDED
          assert set(current)==set(baseline)|ADDED and set(baseline)-set(current)==set()
          assert {name for name in baseline if current[name]!=baseline[name]}==REVIEWED
          unchanged={name:item for name,item in baseline.items() if name not in REVIEWED}
          assert len(unchanged)==UNCHANGED_COUNT and fingerprint(unchanged)==UNCHANGED_FINGERPRINT
          assert all(current[name]==item for name,item in unchanged.items())
          assert all((root/name).read_bytes()==subprocess.check_output(['git','show',BASE+':'+name],cwd=root) for name in METADATA)
          assert '整体内容指纹：`'+fingerprint(current)+'`' in manifest.decode()
          assert 'Package.swift' not in REVIEWED|ADDED
          assert {name for name in REVIEWED|ADDED if name.endswith('.py')}==set()
          board=(root/'Sources/VideoMedia/CommunityNoticeBoardArtwork.swift').read_text()
          encoded=re.findall(r'private static let encoded = """\n(.*?)\n"""',board,re.S)
          assert len(encoded)==1
          png=base64.b64decode(''.join(encoded[0].split()),validate=True)
          assert hashlib.sha256(png).hexdigest()=='ee4831de0254aae28c7d3b6ac1affc097b52c73555c502f54df903f9ec0df4ae'
          assert png[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',png[16:24])==(1672,941) and png[25]==6
          print('public_payloads='+str(len(current))+' direct_baseline_payloads=371 additions='+str(len(ADDED))+' removals=0 reviewed_changed='+str(len(REVIEWED))+' unchanged='+str(len(unchanged)))
          print('current_payload_sha256='+fingerprint(current)+' unchanged_sha256='+fingerprint(unchanged))
          print('complete_embedded_board_original_verified=true fixed_font_originals_and_licenses_verified=true source_baseline='+BASE)
          PYCODE

      - name: Run retained and first-frame cover rules plus ordinary production
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, shutil, subprocess, sys, time
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-cover2010-swiftpm'
