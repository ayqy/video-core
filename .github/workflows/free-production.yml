name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact current payload and protected baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          manifest_text=(root/'SOURCE-MANIFEST.md').read_text()
          entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',manifest_text)
          rows={name:(digest,int(size)) for digest,size,name in entries}
          assert len(entries)==len(rows)==320
          for name,(digest,size) in rows.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          metadata={'.gitignore','docs/.nojekyll','docs/index.html','docs/privacy.html','docs/site.css','docs/support.html','docs/terms.html'}
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(rows)|metadata|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          BASE_PUBLIC_COMMIT='8826b04a2716a2d9d5baf2673fbe1588ace204c4'
          ADDITIONS={'Sources/VideoCore/ModelScene3D.swift', 'Sources/VideoMedia/ModelPackageMedia.swift', 'Tests/VideoMediaTests/ModelPackageMediaTests.swift'}
          REVIEWED_CHANGED={'.github/workflows/free-production.yml'}
          PROTECTED_COUNT=316
          PROTECTED_SHA256='a74fb62c13485a06b14ce95cc6b41e90b44bb795d4325205e88770ef209f3b20'
          assert len(ADDITIONS)==3 and len(REVIEWED_CHANGED)==1
          assert ADDITIONS<=set(rows)
          assert REVIEWED_CHANGED<=set(rows)
          protected={name:value for name,value in rows.items() if name not in REVIEWED_CHANGED and name not in ADDITIONS}
          digest_input=''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected)==PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest()==PROTECTED_SHA256
          inventory_input=''.join(f'{name}\0{rows[name][0]}\0{rows[name][1]}\n' for name in sorted(rows))
          inventory_sha256=hashlib.sha256(inventory_input.encode()).hexdigest()
          assert f'整体内容指纹：`{inventory_sha256}`' in manifest_text
          print('current_payload_fingerprint='+inventory_sha256)
          print('manifest_payloads=320 added_public_inputs=3 changed_reviewed_inputs=1 unchanged_protected_inputs=316 source_commit='+head)
          print('protected_baseline_commit='+BASE_PUBLIC_COMMIT+' current_native_checks=pending current_python_rules=86 reused_python_rules=25')
          PYCODE

      - name: Execute exactly the affected caption production Python rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, io, os, sys, unittest
          root=Path(os.environ['GITHUB_WORKSPACE'])
          sys.path.insert(0,str(root/'Integrations'))
          groups=[('test_story_speech',29),('test_production_document',24),('test_production_workflow',33)]
          def tests(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite):yield from tests(item)
                  else:yield item
          suites=[unittest.defaultTestLoader.loadTestsFromName(name) for name,_ in groups]
          identities=[[test.id() for test in tests(suite)] for suite in suites]
          assert all(len(items)==len(set(items))==count and all(identity.startswith(name+'.') for identity in items)
                     for (name,count),items in zip(groups,identities))
          expected={identity for items in identities for identity in items}
          assert len(expected)==sum(count for _,count in groups)==86
          for name,_ in groups:
              print('current_python_test_source_sha256='+name+':'+hashlib.sha256((root/'Integrations'/(name+'.py')).read_bytes()).hexdigest())
          class ExactResult(unittest.TextTestResult):
              def __init__(self,*args,**kwargs):
                  super().__init__(*args,**kwargs);self.started=[];self.passed=[]
              def startTest(self,test):
                  self.started.append(test.id());super().startTest(test)
              def addSuccess(self,test):
                  self.passed.append(test.id());super().addSuccess(test)
          output=io.StringIO()
          result=unittest.TextTestRunner(stream=output,verbosity=2,resultclass=ExactResult).run(unittest.TestSuite(suites))
          if not result.wasSuccessful():
              print(output.getvalue()[-9000:],file=sys.stderr)
              raise RuntimeError('Affected caption production Python rules failed')
          assert not result.failures and not result.errors and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
          assert len(result.started)==len(set(result.started))==len(result.passed)==len(set(result.passed))==result.testsRun==86
          assert set(result.started)==set(result.passed)==expected
          for identity in sorted(expected):print('current_python_passed='+identity)
          print('current_python_rules=86 reused_python_rules=25 real_business_media_executed=false review=false')
          PYCODE

      - name: Compile the ordinary VideoCore dependency for testability
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import os, subprocess, sys, time
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-production-swiftpm'
          argv=['swift','build','-c','release','--target','VideoCore','--scratch-path',str(scratch),'-j','2','-Xswiftc','-enable-testing']
          started_at=time.monotonic()
          try:
              result=subprocess.run(argv,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=650)
          except subprocess.TimeoutExpired as error:
              captured=error.stdout or b''
              if isinstance(captured,str):captured=captured.encode('utf-8',errors='replace')
              print('native_core_precompile_timeout_seconds=650 captured_stdout_bytes='+str(len(captured)),file=sys.stderr)
              print(captured[-9000:].decode('utf-8',errors='replace') if captured else 'captured_stdout_unavailable',file=sys.stderr)
              raise
          assert len(result.stdout.encode())<=16*1024*1024,'Bounded compiler diagnostics required'
          if result.returncode:
              print(result.stdout.encode('utf-8',errors='replace')[-9000:].decode('utf-8',errors='replace'),file=sys.stderr)
              raise RuntimeError('Ordinary VideoCore dependency precompile failed')
          print('current_native_core_precompile=1 elapsed_seconds='+format(time.monotonic()-started_at,'.3f')+' native_tests_in_precompile=0 source_changed=false review=false')
          PYCODE

      - name: Compile the ordinary test products with the same explicit testability inputs
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import os, subprocess, sys, time
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-production-swiftpm'
          argv=['swift','build','-c','release','--build-tests','--scratch-path',str(scratch),'-j','2','-Xswiftc','-enable-testing']
          started_at=time.monotonic()
          try:
              result=subprocess.run(argv,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=650)
          except subprocess.TimeoutExpired as error:
              captured=error.stdout or b''
              if isinstance(captured,str):captured=captured.encode('utf-8',errors='replace')
              print('native_test_build_timeout_seconds=650 captured_stdout_bytes='+str(len(captured)),file=sys.stderr)
              print(captured[-9000:].decode('utf-8',errors='replace') if captured else 'captured_stdout_unavailable',file=sys.stderr)
              raise
          assert len(result.stdout.encode())<=16*1024*1024,'Bounded compiler diagnostics required'
          if result.returncode:
              print(result.stdout.encode('utf-8',errors='replace')[-9000:].decode('utf-8',errors='replace'),file=sys.stderr)
              raise RuntimeError('Ordinary test products build failed')
          print('current_native_test_product_builds=1 elapsed_seconds='+format(time.monotonic()-started_at,'.3f')+' native_rules_executed_in_compile=0 cache_reuse_claimed=false review=false')
          PYCODE

      - name: Execute exactly the affected ordinary Native rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess, sys, time
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-production-swiftpm'
          groups=[('VideoCoreTests','MediaPresentationTests',7),
                  ('VideoMediaTests','MediaPresentationMediaTests',6),
                  ('VideoMediaTests','MediaFramingMediaTests',2),
                  ('VideoCoreTests','MediaConfirmationTests',14),
                  ('VideoMediaTests','ModelPackageMediaTests',3)]
          expected=set()
          for module,name,count in groups:
              source=root/'Tests'/module/(name+'.swift')
              methods=re.findall(r'func (test[A-Za-z0-9_]+)\(',source.read_text())
              assert len(methods)==len(set(methods))==count
              identities={module+'.'+name+'.'+method for method in methods}
              assert not expected&identities
              expected.update(identities)
              print('current_native_test_source_sha256='+name+':'+hashlib.sha256(source.read_bytes()).hexdigest())
          assert len(expected)==32
          selection='('+'|'.join(name for _,name,_ in groups)+')'
          argv=['swift','test','--skip-build','-c','release','--scratch-path',str(scratch),'-j','2','-Xswiftc','-enable-testing','--filter',selection]
          started_at=time.monotonic()
          try:
              result=subprocess.run(argv,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=650)
          except subprocess.TimeoutExpired as error:
              captured=error.stdout or b''
              if isinstance(captured,str):captured=captured.encode('utf-8',errors='replace')
              print('native_rules_timeout_seconds=650 captured_stdout_bytes='+str(len(captured)),file=sys.stderr)
              print(captured[-9000:].decode('utf-8',errors='replace') if captured else 'captured_stdout_unavailable',file=sys.stderr)
              raise
          assert len(result.stdout.encode())<=16*1024*1024,'Bounded compiler/test diagnostics required'
          if result.returncode:
              print(result.stdout.encode('utf-8',errors='replace')[-9000:].decode('utf-8',errors='replace'),file=sys.stderr)
              raise RuntimeError('Affected Native test execution failed')
          started=['.'.join(row) for row in re.findall(r"Test Case '-\[([^ ]+) ([^]]+)\]' started",result.stdout)]
          passed=['.'.join(row) for row in re.findall(r"Test Case '-\[([^ ]+) ([^]]+)\]' passed",result.stdout)]
          assert len(started)==len(set(started))==len(passed)==len(set(passed))==len(expected)
          assert set(started)==set(passed)==expected
          assert 'failed' not in result.stdout.lower() and 'skipped' not in result.stdout.lower()
          for identity in sorted(expected):print('current_native_passed='+identity)
          print('current_native_rules=32 elapsed_seconds='+format(time.monotonic()-started_at,'.3f')+' current_python_rules=86 reused_python_rules=25 synthetic_fixture_media=true real_business_media_executed=false review=false')
          PYCODE

      - name: Build the ordinary Release CLI
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os, subprocess, sys, time
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          def execute(argv,seconds):
              started_at=time.monotonic()
              try:
                  result=subprocess.run(argv,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=seconds)
              except subprocess.TimeoutExpired as error:
                  captured=error.stdout or b''
                  if isinstance(captured,str):captured=captured.encode('utf-8',errors='replace')
                  print('ordinary_release_build_timeout_seconds='+str(seconds)+' captured_stdout_bytes='+str(len(captured)),file=sys.stderr)
                  print(captured[-9000:].decode('utf-8',errors='replace') if captured else 'captured_stdout_unavailable',file=sys.stderr)
                  raise
              if result.returncode:
                  print(result.stdout.encode('utf-8',errors='replace')[-9000:].decode('utf-8',errors='replace'),file=sys.stderr)
                  raise RuntimeError('Ordinary CLI build failed')
              assert len(result.stdout.encode())<=16*1024*1024,'Bounded build diagnostics required'
              print('ordinary_release_command_elapsed_seconds='+format(time.monotonic()-started_at,'.3f')+' budget_seconds='+str(seconds))
              return result.stdout
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-production-swiftpm'
          execute(['swift','build','-c','release','--product','video','--scratch-path',str(scratch),'-j','2'],650)
          bins=execute(['swift','build','-c','release','--scratch-path',str(scratch),'-j','2','--show-bin-path'],30).strip()
          product=Path(bins)/'video'
          assert product.is_file() and not product.is_symlink() and os.access(product,os.X_OK)
          print('current_release_cli_builds=1 current_native_rules=32 current_python_rules=86 reused_python_rules=25 real_business_media_executed=false review=false')
          PYCODE

      - name: Record exact current Native and reused Python evidence boundaries
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os
          text=("本次实际执行三个完整受影响 Python 模块：test_story_speech 29 项、test_production_document 24 项、test_production_workflow 33 项，共 86 个唯一测试身份；未变的 test_speech_plan_alignment 12 项和 test_production_styles 13 项按各自源码与调用条件复用，共 25 项，不重复计数。遗漏、重复、失败、skip、预期失败或不完整汇总均拒绝。\n\n"
                "在同一 scratch、release 配置和 -j2 下，先以显式 -Xswiftc -enable-testing 编译 VideoCore，再以同一显式参数执行 swift build --build-tests；两段都成功后才执行原29条及新增3条模型Native规则，swift test --skip-build 不再编译。最后保留原普通 Release CLI 构建。四段各保留 650 秒预算，外层 job 50 分钟有限上限；各段成功打印实际 elapsed，不预称缓存已复用。所有 build/test 超时打印捕获原 stdout 的最多 9000 字节原尾后仍失败；缺失明确报告，不忽略超时。编译不执行规则、不说明性能根因，也不授效果通过。\n\n"
                "保留现有四个 Native 类 29 项，并新增 ModelPackageMediaTests 3 项，共 32 个唯一实际身份，每项 started、passed 各一次；随后显式 -j2 构建普通 Release video CLI。新增模型规则验证原 DAE 纹理依赖、权利与工作区隔离、真实网格加载及拒绝输入；使用合成网格，不冒真实动森素材、角色动作或成片验收。\n\n"
                "新增字幕分段是显式可选的 observed-natural-cues 策略，使用真实整词与精确 TN 映射，保持原文、原音、完整动作和旧缺省一镜一条字幕行为。纯规则测试使用合成观察或临时假消费者；不冒真实 SDK、影片制作、正常观看、声音试听、字幕确认或整片审核。真实用户链有独立托管证据。\n\n"
                "320 项公开载荷逐件核同，整体指纹从当次 manifest 动态计算。新增模型资源定义、原生加载器和测试三项，仅唯一 workflow 发生既有载荷修改；其余 316 项保持公开基线 8826b04a2716a2d9d5baf2673fbe1588ace204c4 原字节。\n\n"
                "本 workflow 不读取私有源码、业务素材或凭据，不含闭源 Painter，不调用 TTS、外部服务、Mac App 或高级模块；不授声音听审、字幕确认、商业权利、上传同意或整片批准。\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:stream.write(text)
          print('current_native_rules=32 current_python_rules=86 reused_python_rules=25 current_release_cli_builds=1 real_business_media_executed=false review=false')
          PYCODE
