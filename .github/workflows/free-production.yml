name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact 331 payloads against the direct immutable 329 baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          BASE='3b38b98e0503633f28a4b391adae93327278b2d9'
          ADDITIONS=set(['Sources/VideoCore/SceneAudioCues.swift', 'Tests/VideoCoreTests/SceneAudioCueTests.swift'])
          REVIEWED=set(['.github/workflows/free-production.yml', 'Sources/VideoCore/AgentSchemas.swift', 'Sources/VideoCore/AudioMixRules.swift', 'Sources/VideoCore/Dependencies.swift', 'Sources/VideoCore/Editing.swift', 'Sources/VideoCore/Models.swift', 'Sources/VideoMedia/Renderer.swift', 'Sources/VideoMedia/VisualCache.swift', 'Tests/VideoMediaTests/AudioMixMediaTests.swift', 'Tests/VideoMediaTests/VisualCacheResumeTests.swift'])
          METADATA=set(['.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'])
          def digest_rows(value):
              return hashlib.sha256(''.join(f'{name}\0{value[name][0]}\0{value[name][1]}\n' for name in sorted(value)).encode()).hexdigest()
          def parse(text):
              values=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',text)
              result={name:(digest,int(size)) for digest,size,name in values}
              assert len(result)==len(values)>0
              return result
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          text=(root/'SOURCE-MANIFEST.md').read_text()
          current=parse(text)
          assert len(current)==331
          for name,(digest,size) in current.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in name
              path=root/relative
              assert path.is_file() and not any(p.is_symlink() for p in (path,*path.parents))
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(current)|METADATA|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          assert not any('scene-audio-cc0-v1' in name or name.lower().endswith('.wav') for name in tracked)
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',BASE],cwd=root,check=True,timeout=60,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          baseline=parse(subprocess.check_output(['git','show',BASE+':SOURCE-MANIFEST.md'],cwd=root,text=True))
          assert len(baseline)==329 and digest_rows(baseline)=='36ef038022eb9e2cb5fe219d9711809d646a7119fe6e77d253a81e577c4f193f'
          for name in METADATA:
              assert (root/name).read_bytes()==subprocess.check_output(['git','show',BASE+':'+name],cwd=root),name
          assert set(current)==set(baseline)|ADDITIONS and not set(baseline)&ADDITIONS
          assert {name for name in baseline if current[name]!=baseline[name]}==REVIEWED
          unchanged={name:value for name,value in baseline.items() if name not in REVIEWED}
          assert len(unchanged)==319 and digest_rows(unchanged)=='01d6e6e2f769a8ac685632e4be60ee16574460dde38bbdf96174f509fff473f6'
          assert all(current[name]==value for name,value in unchanged.items())
          assert '整体内容指纹：`'+digest_rows(current)+'`' in text
          # Only the workflow, Core/Host audio rules/cache and two additions differ.
          # The existing Python modules, SDK inputs, Package and ordinary recipe bytes
          # retain the direct 3b baseline. Reuse its confirmed run; do not call 169 tests new.
          assert not any(name.startswith('Integrations/') or name in {'Package.swift','README.md'} for name in REVIEWED)
          print('public_payloads=331 direct_baseline_payloads=329 additions=2 reviewed_changed='+str(len(REVIEWED))+' unchanged='+str(len(unchanged)))
          print('current_payload_sha256='+digest_rows(current)+' unchanged_sha256='+digest_rows(unchanged))
          print('reused_python_rules=169 current_python_rules=0 sdk_rules_reused=true prior_run='+'https://github.com/ayqy/video-core/actions/runs/41956201470')
          PYCODE

