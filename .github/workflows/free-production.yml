name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  knowledge-production-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact 335 cover payloads against the direct immutable 331 baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          BASE='9a41989f13b84441fad023c3afb3a60e20adf500'
          ADDITIONS=set(['Sources/VideoCore/CoverPresentation.swift', 'Sources/VideoMedia/CoverPainter.swift', 'Tests/VideoCoreTests/CoverPresentationTests.swift', 'Tests/VideoMediaTests/CoverMediaTests.swift'])
          REVIEWED=set(['.github/workflows/free-production.yml', 'Integrations/skills/video/references/narration-writing.md', 'Integrations/skills/video/references/protocol.md', 'README.md', 'Sources/VideoCore/AgentSchemas.swift', 'Sources/VideoCore/Dependencies.swift', 'Sources/VideoCore/Editing.swift', 'Sources/VideoCore/Layers.swift', 'Sources/VideoCore/MediaConfirmation.swift', 'Sources/VideoCore/Models.swift', 'Sources/VideoCore/Storage.swift', 'Sources/VideoMedia/Renderer.swift', 'Tests/VideoMediaTests/ContentProjectMediaTests.swift'])
          METADATA=set(['.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'])
          def parse(raw):
              entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',raw)
              value={name:(digest,int(size)) for digest,size,name in entries}
              assert entries and len(value)==len(entries)
              return value
          def fingerprint(value):
              return hashlib.sha256(''.join(f'{name}\0{value[name][0]}\0{value[name][1]}\n' for name in sorted(value)).encode()).hexdigest()
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()==os.environ['VIDEO_SOURCE_COMMIT']
          manifest=(root/'SOURCE-MANIFEST.md').read_text()
          current=parse(manifest)
          assert len(current)==335
          for name,(digest,size) in current.items():
              relative=Path(name); path=root/relative
              assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in name
              assert path.is_file() and not any(p.is_symlink() for p in (path,*path.parents))
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(current)|METADATA|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          assert not any(name.lower().endswith(('.wav','.mp3','.png','.jpg','.jpeg','.webp','.dae')) for name in tracked)
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',BASE],cwd=root,check=True,timeout=60,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          raw=subprocess.check_output(['git','show',BASE+':SOURCE-MANIFEST.md'],cwd=root)
          assert hashlib.sha256(raw).hexdigest()=='8a964ea59e020e467768cd70fd7c1f429fe3a754f8411467f092d984e5360647'
          baseline=parse(raw.decode())
          assert len(baseline)==331 and fingerprint(baseline)=='dd8e95b4636011ced3b14d80fe502fc70a40d642620422022ceeabfc7786ab68'
          assert set(current)==set(baseline)|ADDITIONS and not set(baseline)&ADDITIONS
          assert {name for name in baseline if current[name]!=baseline[name]}==REVIEWED
          unchanged={name:value for name,value in baseline.items() if name not in REVIEWED}
          assert len(unchanged)==318 and fingerprint(unchanged)=='2050833e03183523a496e0afca0d2d1ed9245c7e962f972334aa31891d6f1949'
          assert all(current[name]==value for name,value in unchanged.items())
          assert all((root/name).read_bytes()==subprocess.check_output(['git','show',BASE+':'+name],cwd=root) for name in METADATA)
          assert '整体内容指纹：`'+fingerprint(current)+'`' in manifest
          # Only the listed protocol/nickname documentation changes under Integrations. Python
          # implementations, SDK inputs, Package and ordinary production recipe stay exact.
          assert not any(name.endswith('.py') or name=='Package.swift' for name in REVIEWED)
          print('public_payloads='+str(len(current))+' direct_baseline_payloads=331 additions=4 reviewed_changed='+str(len(REVIEWED))+' unchanged='+str(len(unchanged)))
          print('current_payload_sha256='+fingerprint(current)+' unchanged_sha256='+fingerprint(unchanged))
          print('reused_python_rules=169 current_python_rules=0 sdk_rules_reused=true prior_run='+'https://github.com/ayqy/video-core/actions/runs/41985506573')
          PYCODE

      - name: Run finite cover and editing rules with real ordinary public production
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, shutil, subprocess, sys, time
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-template-cover-swiftpm'
          SELECTED={'CoverPresentationTests': ['testAutomaticStyleFollowsRealSceneKindsAndAuthoredPresentation', 'testCoverOnlySourceRefreshPreservesMovieAndInvalidatesFilmReview', 'testEveryPoseAndItsRightsFreezeWithoutAffectingUnrelatedSceneAudio', 'testForeignOrNonImageCoverCannotEnterEditorDatabaseOrFreeze', 'testNicknameOnlyAppliesToIdentifiedDoubaoPresenter', 'testNormalCoverEditChangesDigestClearsFilmReviewAndPreservesCaptionsAndVoice', 'testOldProjectEncodingHasNoNewFieldAndRoundTripsItsDigest', 'testOnlyCoverParentChainRetainsIndependentDeclarationsAndNeverFilmReview', 'testSchemaPublishesBoundedTypedCoverAndNormalEdit', 'testThemeSelectsRealExpressionAndExplicitHeroWins', 'testUnknownFieldsVersionInvalidCropAndEmptyTitlesAreRejected'], 'CoverMediaTests': ['testCoverSourcesAndSettingsSurviveOrdinaryFullBackupAndRejectTamperedBytes', 'testCroppedImportedBitmapChangesCoverAndMissingImageCannotFallback', 'testEveryStyleHasTwoDistinctDeterministicReadableTemplatesInBothAspects'], 'ContentProjectMediaTests': ['testEmptyContentDraftCannotRenderOrDrawUnprovenProductPrice', 'testOrdinaryJobRendersRealMediaWithoutProductAndBackupRestoresArtifacts'], 'DependencyTests': ['testAddingSourceToEarlierSnapshotRequiresNewFreeze', 'testCyclicRightsGraphPropagatesEveryAffectedSceneWithoutLooping', 'testEvidenceExpiryInvalidatesOnlyReferencingSceneAndPreservesOriginal', 'testFrozenPageDependencyIgnoresUnusedPageButInvalidatesReferencedPage', 'testLayerImageAndCharacterVoiceRightsBelongToDependencyGraph', 'testLegacyRevisionDecodesWithoutNewOptionalFields', 'testMappingRequiresActualBoundedPagesAndConfirmedText', 'testMappingsAndSceneReferencesCannotCrossWorkspace', 'testSourceEditPreservesHistoryAndSkipsUnrelatedPagesAndWorkspace', 'testTimeRangeUsesRealMediaLengthAndRespectsSceneLock'], 'MediaConfirmationTests': ['testBackupColdRestorePreservesTheIndependentRecordAndOriginalHistory', 'testBothLocalConfirmationsStillRequireAnActualCompletePreviewAndFiveReviews', 'testCaptionConfirmationIsIndependentFromVoiceAndWholeFilmReview', 'testChangedExpectedDigestVoiceSourceTextDurationOrCaptionTimingRejectsAtomically', 'testChangedSourceMetadataAndMissingHistoricalReferencesOnlyInvalidateLookup', 'testDryRunAndStrictCommandSchemaNeverWriteOrAcceptNestedApprovals', 'testLegacySnapshotWithoutTheOptionalLedgerKeepsItsExactRevisionDigest', 'testNewRevisionNeverInheritsTheOldConfirmationEvenWithTheSameVoice', 'testOriginalApprovalCannotConfirmCaptionsAndEstimatedTimingCannotClaimReliableTimestamps', 'testPhysicalSourceBytesMustStillMatchBeforeTheAtomicWrite', 'testPhysicalSourceFileSymlinkParentSymlinkAndHardlinkAreRejected', 'testRequestReplayIsIdempotentAndChangedClaimCannotReuseTheRequestID', 'testSourceApprovalKeepsContentJobsAndFiveReviewsUnchanged', 'testWrongWorkspacePrincipalAndStaleRevisionCannotRecordConfirmation'], 'LayerTests': ['testCommentCannotReferenceOtherVersionSceneOrTime', 'testExplicitLayerUnlockAllowsChangingItsStoryActionAndKeepsLockedHistory', 'testLayerLocksAndExplicitUnlock', 'testLockedLayerAllowsActionReorderingOtherSubjectsAndRecipientReferences', 'testLockedLayerRejectsRemovingAddingAndChangingItsStoryActions', 'testPlainLayerPauseAndMotionSurviveAlignedSpeedSplits', 'testSplitRetimesLayerAndKeepsHistory', 'testUnchangedLockedLayerCannotBeMovedThroughItsStoryAction', 'testVisualPauseHoldsTheFinalSourceWithoutExtendingCaptionWindowsOrAuthoredExits'], 'SplitTimelineRulesTests': ['testOrdinarySplitPreservesSourceSamplesAndLeavesTailPauseOnlyOnFinalPiece', 'testRepresentableRetimedSplitKeepsEverySourceSampleAndTrailingHold', 'testRetimedSplitRejectsAddedFrameAndChangedSamplingPhase']}
          FILES={'CoverPresentationTests': 'Tests/VideoCoreTests/CoverPresentationTests.swift', 'CoverMediaTests': 'Tests/VideoMediaTests/CoverMediaTests.swift', 'ContentProjectMediaTests': 'Tests/VideoMediaTests/ContentProjectMediaTests.swift', 'DependencyTests': 'Tests/VideoCoreTests/DependencyTests.swift', 'MediaConfirmationTests': 'Tests/VideoCoreTests/MediaConfirmationTests.swift', 'LayerTests': 'Tests/VideoCoreTests/LayerTests.swift', 'SplitTimelineRulesTests': 'Tests/VideoCoreTests/SplitTimelineRulesTests.swift'}
          EXPECTED=set(['ContentProjectMediaTests.testEmptyContentDraftCannotRenderOrDrawUnprovenProductPrice', 'ContentProjectMediaTests.testOrdinaryJobRendersRealMediaWithoutProductAndBackupRestoresArtifacts', 'CoverMediaTests.testCoverSourcesAndSettingsSurviveOrdinaryFullBackupAndRejectTamperedBytes', 'CoverMediaTests.testCroppedImportedBitmapChangesCoverAndMissingImageCannotFallback', 'CoverMediaTests.testEveryStyleHasTwoDistinctDeterministicReadableTemplatesInBothAspects', 'CoverPresentationTests.testAutomaticStyleFollowsRealSceneKindsAndAuthoredPresentation', 'CoverPresentationTests.testCoverOnlySourceRefreshPreservesMovieAndInvalidatesFilmReview', 'CoverPresentationTests.testEveryPoseAndItsRightsFreezeWithoutAffectingUnrelatedSceneAudio', 'CoverPresentationTests.testForeignOrNonImageCoverCannotEnterEditorDatabaseOrFreeze', 'CoverPresentationTests.testNicknameOnlyAppliesToIdentifiedDoubaoPresenter', 'CoverPresentationTests.testNormalCoverEditChangesDigestClearsFilmReviewAndPreservesCaptionsAndVoice', 'CoverPresentationTests.testOldProjectEncodingHasNoNewFieldAndRoundTripsItsDigest', 'CoverPresentationTests.testOnlyCoverParentChainRetainsIndependentDeclarationsAndNeverFilmReview', 'CoverPresentationTests.testSchemaPublishesBoundedTypedCoverAndNormalEdit', 'CoverPresentationTests.testThemeSelectsRealExpressionAndExplicitHeroWins', 'CoverPresentationTests.testUnknownFieldsVersionInvalidCropAndEmptyTitlesAreRejected', 'DependencyTests.testAddingSourceToEarlierSnapshotRequiresNewFreeze', 'DependencyTests.testCyclicRightsGraphPropagatesEveryAffectedSceneWithoutLooping', 'DependencyTests.testEvidenceExpiryInvalidatesOnlyReferencingSceneAndPreservesOriginal', 'DependencyTests.testFrozenPageDependencyIgnoresUnusedPageButInvalidatesReferencedPage', 'DependencyTests.testLayerImageAndCharacterVoiceRightsBelongToDependencyGraph', 'DependencyTests.testLegacyRevisionDecodesWithoutNewOptionalFields', 'DependencyTests.testMappingRequiresActualBoundedPagesAndConfirmedText', 'DependencyTests.testMappingsAndSceneReferencesCannotCrossWorkspace', 'DependencyTests.testSourceEditPreservesHistoryAndSkipsUnrelatedPagesAndWorkspace', 'DependencyTests.testTimeRangeUsesRealMediaLengthAndRespectsSceneLock', 'LayerTests.testCommentCannotReferenceOtherVersionSceneOrTime', 'LayerTests.testExplicitLayerUnlockAllowsChangingItsStoryActionAndKeepsLockedHistory', 'LayerTests.testLayerLocksAndExplicitUnlock', 'LayerTests.testLockedLayerAllowsActionReorderingOtherSubjectsAndRecipientReferences', 'LayerTests.testLockedLayerRejectsRemovingAddingAndChangingItsStoryActions', 'LayerTests.testPlainLayerPauseAndMotionSurviveAlignedSpeedSplits', 'LayerTests.testSplitRetimesLayerAndKeepsHistory', 'LayerTests.testUnchangedLockedLayerCannotBeMovedThroughItsStoryAction', 'LayerTests.testVisualPauseHoldsTheFinalSourceWithoutExtendingCaptionWindowsOrAuthoredExits', 'MediaConfirmationTests.testBackupColdRestorePreservesTheIndependentRecordAndOriginalHistory', 'MediaConfirmationTests.testBothLocalConfirmationsStillRequireAnActualCompletePreviewAndFiveReviews', 'MediaConfirmationTests.testCaptionConfirmationIsIndependentFromVoiceAndWholeFilmReview', 'MediaConfirmationTests.testChangedExpectedDigestVoiceSourceTextDurationOrCaptionTimingRejectsAtomically', 'MediaConfirmationTests.testChangedSourceMetadataAndMissingHistoricalReferencesOnlyInvalidateLookup', 'MediaConfirmationTests.testDryRunAndStrictCommandSchemaNeverWriteOrAcceptNestedApprovals', 'MediaConfirmationTests.testLegacySnapshotWithoutTheOptionalLedgerKeepsItsExactRevisionDigest', 'MediaConfirmationTests.testNewRevisionNeverInheritsTheOldConfirmationEvenWithTheSameVoice', 'MediaConfirmationTests.testOriginalApprovalCannotConfirmCaptionsAndEstimatedTimingCannotClaimReliableTimestamps', 'MediaConfirmationTests.testPhysicalSourceBytesMustStillMatchBeforeTheAtomicWrite', 'MediaConfirmationTests.testPhysicalSourceFileSymlinkParentSymlinkAndHardlinkAreRejected', 'MediaConfirmationTests.testRequestReplayIsIdempotentAndChangedClaimCannotReuseTheRequestID', 'MediaConfirmationTests.testSourceApprovalKeepsContentJobsAndFiveReviewsUnchanged', 'MediaConfirmationTests.testWrongWorkspacePrincipalAndStaleRevisionCannotRecordConfirmation', 'SplitTimelineRulesTests.testOrdinarySplitPreservesSourceSamplesAndLeavesTailPauseOnlyOnFinalPiece', 'SplitTimelineRulesTests.testRepresentableRetimedSplitKeepsEverySourceSampleAndTrailingHold', 'SplitTimelineRulesTests.testRetimedSplitRejectsAddedFrameAndChangedSamplingPhase'])
          expected=set()
          for name,methods in SELECTED.items():
              path=root/FILES[name]; text=path.read_text()
              assert len(re.findall(r'(?m)^final class '+re.escape(name)+r'\s*:\s*XCTestCase\b',text))==1
              actual=re.findall(r'(?m)^\s*func (test\w+)\s*\(',text)
              assert len(actual)==len(set(actual)) and set(methods)==set(actual)
              expected.update(name+'.'+method for method in methods)
              print('current_native_source_sha256='+name+':'+hashlib.sha256(path.read_bytes()).hexdigest())
          assert expected==EXPECTED
          def execute(argv,seconds,label):
              started=time.monotonic()
              try:
                  result=subprocess.run(argv,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=seconds)
              except subprocess.TimeoutExpired as error:
                  captured=error.stdout or b''
                  if isinstance(captured,str):captured=captured.encode('utf-8',errors='replace')
                  print(captured[-9000:].decode('utf-8',errors='replace'),file=sys.stderr);raise
              assert len(result.stdout.encode())<=16*1024*1024
              if result.returncode:
                  print(result.stdout.encode('utf-8',errors='replace')[-9000:].decode('utf-8',errors='replace'),file=sys.stderr)
                  raise RuntimeError(label+' failed')
              print(label+'_passed=true elapsed_seconds='+format(time.monotonic()-started,'.3f'))
              return result.stdout
          common=['--package-path',str(root),'--scratch-path',str(scratch),'-c','release','--jobs','2','-Xswiftc','-enable-testing']
          execute(['swift','build',*common,'--target','VideoCore'],650,'public_core_compile')
          execute(['swift','build',*common,'--build-tests'],650,'public_test_product_compile')
          pattern='('+'|'.join(r'(?:^|[./])'+re.escape(item.rsplit('.',1)[0])+r'[./]'+re.escape(item.rsplit('.',1)[1])+'$' for item in sorted(expected))+')'
          output=execute(['swift','test',*common,'--skip-build','--filter',pattern],480,'public_affected_native')
          events=re.findall(r"Test Case '-\[([^ ]+) ([^\]]+)\]' (started|passed)",output)
          actual={state:[scope.split('.')[-1]+'.'+method for scope,method,kind in events if kind==state] for state in ('started','passed')}
          assert all(len(items)==len(set(items))==len(expected) and set(items)==expected for items in actual.values())
          assert not re.search(r"(?m)^Test (?:Case|Suite) '[^\r\n]*' (?:failed|skipped)\b",output)
          for identity in sorted(expected):print('current_native_passed='+identity)
          execute(['swift','build',*common,'--product','video'],650,'public_release_cli')
          bins=execute(['swift','build',*common,'--show-bin-path'],30,'public_release_bin_path').strip()
          binary=Path(bins)/'video'
          assert binary.is_file() and not binary.is_symlink() and os.access(binary,os.X_OK)
          if not (shutil.which('ffmpeg') and shutil.which('ffprobe')):
              assert shutil.which('brew');execute(['brew','install','ffmpeg'],120,'public_smoke_dependency')
          assert shutil.which('ffmpeg') and shutil.which('ffprobe')
          temporary=Path(os.environ['RUNNER_TEMP'])
          smoke=temporary/'video-template-cover-production-smoke'
          cache=temporary/'video-template-cover-production-cache'
          # Same public recipe: normal import/revision/zero-price production, four output
          # bytes, ffprobe/complete audio+video decode and full-source cold restoration.
          execute([sys.executable,'-B',str(root/'Integrations/examples/free_production.py'),'--binary',str(binary),
              '--binary-sha256',hashlib.sha256(binary.read_bytes()).hexdigest(),'--output',str(smoke),'--cache',str(cache)],360,'public_ordinary_production_smoke')
          summary=smoke/'summary.md'
          assert summary.is_file() and '声音、字幕及五项Review始终未审' in summary.read_text()
          manifest=(root/'SOURCE-MANIFEST.md').read_text()
          for digest,size,name in re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',manifest):
              raw=(root/name).read_bytes()
              assert len(raw)==int(size) and hashlib.sha256(raw).hexdigest()==digest,name
          text=('当前公开Package release/jobs=2实际执行'+str(len(expected))+'个唯一受影响Native规则，started/passed各一次，无失败或跳过；普通CLI及正常公开配方四件、完整解码和含源冷恢复通过。\n\n'
                '169项Python/SDK规则的实现和输入保持9a41989原字节，复用run 41985506573，本次未重新执行。\n\n'
                '公开源码不含豆子姐IP原图、动森原素材或闭源绘制实现。规则与普通smoke不授新IP、封面吸引力、动森效果、声音字幕或整片审核。\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:stream.write(text)
          print('current_native_rules='+str(len(expected))+' current_python_rules=0 reused_python_rules=169 current_release_cli_builds=1 ordinary_public_production_smoke=true cover_effects_accepted=false acnh_media_accepted=false listening_accepted=false review=false')
          PYCODE
