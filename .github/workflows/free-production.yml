name: Free production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scene-layout-stage:
    if: github.repository == 'ayqy/video-core' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      VIDEO_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact current payload and protected baseline
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['VIDEO_SOURCE_COMMIT']
          entries=re.findall(r'(?m)^\| ([a-f0-9]{64}) \| ([0-9]+) \| ([^|\n]+) \|$',(root/'SOURCE-MANIFEST.md').read_text())
          rows={name:(digest,int(size)) for digest,size,name in entries}
          assert len(entries)==len(rows)==287
          for name,(digest,size) in rows.items():
              relative=Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,name
          metadata={'.gitignore', 'docs/.nojekyll', 'docs/index.html', 'docs/privacy.html', 'docs/site.css', 'docs/support.html', 'docs/terms.html'}
          tracked=set(subprocess.check_output(['git','ls-files'],cwd=root,text=True).splitlines())
          assert tracked==set(rows)|metadata|{'SOURCE-MANIFEST.md'}
          assert not any((root/name).exists() for name in ['App','MacApp','MacUITests','Examples','Premium','Sources/VideoGame','Sources/VideoCartoon','Sources/VideoAdvanced'])
          BASE_PUBLIC_COMMIT='9d32be9db4de82582cbff497d7db1815a764af0f'
          ADDITIONS={'Integrations/knowledge_story.py','Integrations/test_knowledge_story.py',
                     'Integrations/examples/knowledge_exchange.py','Integrations/knowledge_story_smoke.py'}
          REVIEWED_CHANGED=ADDITIONS|{'.github/workflows/free-production.yml','README.md',
              'Integrations/README.md','Integrations/examples/README.md',
              'Integrations/story_action.py','Integrations/test_story_action.py',
              'Integrations/readaloud_tts.py','Integrations/readaloud_tts.md',
              'Integrations/tests/test_readaloud_tts.py'}
          PROTECTED_COUNT=274
          PROTECTED_SHA256='66a74b79e23731a2c1f338a6b1104a66daa632ffb58d72f29db5fac9f630439c'
          assert ADDITIONS<=set(rows) and REVIEWED_CHANGED<=set(rows)
          protected={name:value for name,value in rows.items() if name not in REVIEWED_CHANGED}
          digest_input=''.join(f'{name}\0{protected[name][0]}\0{protected[name][1]}\n' for name in sorted(protected))
          assert len(protected)==PROTECTED_COUNT and hashlib.sha256(digest_input.encode()).hexdigest()==PROTECTED_SHA256
          print('manifest_payloads=287 unchanged_protected_inputs=274 source_commit='+head)
          print('protected_baseline_commit='+BASE_PUBLIC_COMMIT+' blanket_native_reuse=false')
          PYCODE

      - name: Run current semantic layout and narrated-opening author rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from copy import deepcopy
          import ast, hashlib, sys, unittest
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root/'Integrations'))
          import test_scene_layout
          from narrated_opening import with_narrated_cover, opening_sources
          suite=unittest.defaultTestLoader.loadTestsFromTestCase(test_scene_layout.SceneLayoutTests)
          ids=[case.id() for case in suite]
          tree=ast.parse((root/'Integrations/test_scene_layout.py').read_text())
          definition=next(node for node in tree.body if isinstance(node,ast.ClassDef) and node.name=='SceneLayoutTests')
          methods=[node.name for node in definition.body if isinstance(node,ast.FunctionDef) and node.name.startswith('test_')]
          layout_ids={'test_scene_layout.SceneLayoutTests.'+name for name in methods}
          assert methods and len(methods)==len(set(methods)) and len(ids)==len(set(ids))==len(layout_ids) and set(ids)==layout_ids
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==len(layout_ids) and not result.skipped
          source=[dict(id='cover',durationFrames=48,narration='',captions=[],sourceGain=0,musicGain=0),
                  dict(id='spoken',durationFrames=30,narration='Complete synthetic sentence.',voiceGain=1,muted=False,pauseFrames=0,
                       voice=dict(assetID='synthetic-original',durationFrames=30,listened=False),captions=[dict(text='Complete synthetic sentence.',confirmed=False)])]
          retained=deepcopy(source)
          made=with_narrated_cover(source,'Synthetic opening title')
          expected=deepcopy(source[1:]);expected[0]['title']='Synthetic opening title'
          assert made==expected and source==retained and made[0]['voice']['listened']==False
          for mutation in ('narration','voice','musicGain'):
              invalid=deepcopy(source);invalid[0][mutation]='spoken' if mutation=='narration' else ({'assetID':'original'} if mutation=='voice' else 1)
              try:with_narrated_cover(invalid,'Title')
              except ValueError:pass
              else:raise AssertionError('Spoken or audible cover was discarded')
          try:with_narrated_cover(made,'Title')
          except ValueError:pass
          else:raise AssertionError('The first complete sentence was discarded twice')
          pins=opening_sources(root/'Integrations/scene_layout.py')
          assert pins==dict(recipe=hashlib.sha256((root/'Integrations/scene_layout.py').read_bytes()).hexdigest(),
                            narrated_opening=hashlib.sha256((root/'Integrations/narrated_opening.py').read_bytes()).hexdigest())
          print('semantic_layout_rules=passed distinct_test_ids='+str(len(layout_ids))+' narrated_opening_synthetic_contract=passed private_recipe_audio_fixture=excluded')
          PYCODE

      - name: Run complete affected knowledge-author rules
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import ast, sys, unittest
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root/'Integrations'))
          import test_knowledge_story, test_story_action, test_story_planning
          modules=(test_knowledge_story,test_story_action,test_story_planning)
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromModule(m) for m in modules)
          def flatten(suite):
              for case in suite:
                  if isinstance(case,unittest.TestSuite):yield from flatten(case)
                  else:yield case
          ids=[case.id() for case in flatten(suite)]
          assert len(ids)==len(set(ids))==44
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==len(ids) and not result.skipped
          from examples.knowledge_exchange import protocol_models, story_plan
          assert story_plan().complete and set(protocol_models())=={'consent','decline'}
          print('current_knowledge_author_rules=passed distinct_test_ids='+str(len(ids))+' native_fixture_only=true review=false')
          PYCODE

      - name: Prepare real local codec tools for offline ReadAloud rules
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Run complete affected ReadAloud audio and boundary rules without network
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import shutil, sys, unittest
          from pathlib import Path
          root=Path.cwd()
          assert shutil.which('ffmpeg') and shutil.which('ffprobe'),'real local codec tools are required'
          sys.path.insert(0,str(root/'Integrations/tests'))
          import test_readaloud_tts
          suite=unittest.defaultTestLoader.loadTestsFromModule(test_readaloud_tts)
          def flatten(suite):
              for case in suite:
                  if isinstance(case,unittest.TestSuite):yield from flatten(case)
                  else:yield case
          ids=[case.id() for case in flatten(suite)]
          assert len(ids)==len(set(ids))==31
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful() and result.testsRun==31 and not result.skipped
          print('current_readaloud_rules=passed distinct_test_ids=31 network=false actual_voice_quality_review=false')
          PYCODE

      - name: Build the current standalone free CLI
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-free-paper-explanation'
          log=Path(os.environ['RUNNER_TEMP'])/'video-free-paper-explanation-build.log'
          try:
              with log.open('wb') as stream:
                  result=subprocess.run(['swift','build','--package-path',str(root),'--scratch-path',str(scratch),'--disable-sandbox','--jobs','2','-c','release','--product','video'],stdout=stream,stderr=subprocess.STDOUT,timeout=1500)
              lines=log.read_text(errors='replace').splitlines()
              errors=[line[:700] for line in lines if re.search(r'error:|fatal error:',line,re.I)]
              print('build_errors='+str(len(errors)))
              for line in errors[-12:]:print(line)
              assert result.returncode==0,'Current standalone free CLI failed to build'
              directory=subprocess.check_output(['swift','build','--package-path',str(root),'--scratch-path',str(scratch),'-c','release','--show-bin-path'],text=True).strip()
              binary=(Path(directory)/'video').resolve(strict=True)
              with Path(os.environ['GITHUB_ENV']).open('a') as stream:stream.write('VIDEO_FREE_BINARY='+str(binary)+'\n')
              print('current_native_build=passed cli_sha256='+hashlib.sha256(binary.read_bytes()).hexdigest())
          finally:log.unlink(missing_ok=True)
          PYCODE

      - name: Exercise the new author through the actual standalone CLI
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import os, subprocess, sys
          from pathlib import Path
          result=subprocess.run([sys.executable,'-B','Integrations/knowledge_story_smoke.py',
              '--binary',os.environ['VIDEO_FREE_BINARY'],'--output',str(Path(os.environ['RUNNER_TEMP'])/'knowledge-author-normal-cli')],
              text=True,capture_output=True,timeout=120)
          print(result.stdout,end='')
          if result.stderr:print(result.stderr,file=sys.stderr,end='')
          assert result.returncode==0,'Actual standalone author chain failed'
          assert result.stdout.startswith('knowledge_story_smoke: passed (28 actual normal CLI calls; '),\
              'Actual author, comparison, no-op and independent recovery call inventory changed'
          PYCODE

      - name: Run affected whole Core classes and exact compatibility methods
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, os, re, subprocess
          SWIFT_SUITES={('VideoCoreTests',suite):suite+'.swift' for suite in
                        ('PaperExplanationQualityTests','StoryActionTests','RouteLayoutTests','CartoonPresenterTests','LayerTexturedPathTests')}
          SELECTED={
              ('VideoCoreTests','PluginProtocolTests'):(
                  'testPublicationSchemaSelectionUsesCurrentDefaultsAndRetainsExplicitLegacyRequests',
                  'testRigVersionTwoRequiresCartoonSixEvenForOneActorAndKeepsLegacyFive',
                  'testCartoonSixDiscoveryBoundsRigTwoWithoutChangingFiveOrExposingHostCausality'),
              ('VideoCoreTests','PluginPackageTests'):(
                  'testCurrentServiceSchemasUseMatchingPublicationDefaultsAndKeepExplicitLegacySelection',
                  'testCurrentReadOnlyProbeRejectsRealDescriptorContractDrift'),
              ('VideoCoreTests','ModuleCatalogPublicationTests'):(
                  'testCurrentPublicationDefaultsStillRequireModuleUpgradeAndRetainPolicy',),
              ('VideoCoreTests','VendorFreeModuleTrustTests'):(
                  'testCompleteFreeClosedPairPassesForOnlyCurrentModuleSchemasAndBothArchitectures',
                  'testRestrictedCartoonSixAddsNoPaidOpenFutureOrPermissionAuthority'),
          }

          def affected_methods(root):
              expected=set()
              for (target,suite),filename in SWIFT_SUITES.items():
                  source=(Path(root)/'Tests'/target/filename).read_text()
                  declaration=re.search(r'(?m)^(?:final )?class '+re.escape(suite)+r'\s*:\s*XCTestCase\s*\{',source)
                  if declaration is None:raise ValueError('Affected XCTest class missing: '+suite)
                  source=source[declaration.end():]
                  following=re.search(r'(?m)^(?:final )?class \w+\s*:',source)
                  if following:source=source[:following.start()]
                  methods=re.findall(r'(?m)^[ \t]*(?:@\w+(?:\([^\n)]*\))?[ \t]+)*func[ \t]+(test\w+)[ \t]*\(',source)
                  if not methods or len(methods)!=len(set(methods)):raise ValueError('Incomplete or duplicate affected methods: '+suite)
                  expected.update((target,suite,method) for method in methods)
              for (target,suite),methods in SELECTED.items():
                  source=(Path(root)/'Tests'/target/(suite+'.swift')).read_text()
                  declared=re.findall(r'(?m)^[ \t]*func[ \t]+(test\w+)[ \t]*\(',source)
                  if not methods or len(set(methods))!=len(methods) or not set(methods)<=set(declared):raise ValueError('Selected compatibility method missing or duplicated')
                  expected.update((target,suite,method) for method in methods)
              return expected

          def swift_filter(expected):
              if not expected:raise ValueError('Empty affected test scope')
              return '|'.join('^'+re.escape(target)+r'\.'+re.escape(suite)+'/'+re.escape(method)+'$'
                              for target,suite,method in sorted(expected))

          def verify_swift_stream(text,expected):
              pattern=re.compile(r"^Test Case '(?:-\[(?:(?P<ot>\w+)\.)?(?P<os>\w+) (?P<om>test\w+)\]|(?:(?P<st>\w+)\.)?(?P<ss>\w+)\.(?P<sm>test\w+))' (?P<event>started|passed|failed|skipped)\b")
              started=[];passed=[]
              for line in text.splitlines():
                  match=pattern.match(line)
                  if match is None:
                      if line.startswith("Test Case '") and re.search(r"' (started|passed|failed|skipped)\b",line):raise ValueError('Unparsed actual XCTest identity')
                      continue
                  suite=match['os'] or match['ss'];method=match['om'] or match['sm'];target=match['ot'] or match['st']
                  if target is None:
                      candidates={r[0] for r in expected if r[1:]==(suite,method)}
                      if len(candidates)!=1:raise ValueError('Ambiguous actual XCTest target')
                      target=candidates.pop()
                  identity=(target,suite,method)
                  if identity not in expected:raise ValueError('Unexpected actual XCTest method')
                  if match['event']=='started':started.append(identity)
                  elif match['event']=='passed':passed.append(identity)
                  else:raise ValueError('Actual affected XCTest failed or skipped')
              if len(started)!=len(expected) or set(started)!=expected:raise ValueError('Missing or duplicate actual XCTest starts')
              if len(passed)!=len(expected) or set(passed)!=expected:raise ValueError('Missing or duplicate actual XCTest passes')
              if len(expected) not in [int(v) for v in re.findall(r'Executed (\d+) tests?',text)]:raise ValueError('Actual XCTest summary incomplete')
              return len(expected)
          root=Path(os.environ['GITHUB_WORKSPACE'])
          expected=affected_methods(root)
          scratch=Path(os.environ['RUNNER_TEMP'])/'video-free-paper-explanation'
          log=Path(os.environ['RUNNER_TEMP'])/'video-free-paper-explanation-rules.log'
          try:
              with log.open('wb') as stream:
                  result=subprocess.run(['swift','test','--package-path',str(root),'--scratch-path',str(scratch),'--disable-sandbox','--jobs','2','-c','release','--filter',swift_filter(expected)],stdout=stream,stderr=subprocess.STDOUT,timeout=900,env=dict(os.environ,VIDEO_TEST_CLI=os.environ['VIDEO_FREE_BINARY']))
              text=log.read_text(errors='replace')
              for line in text.splitlines():
                  if re.search(r'error:|fatal error:|Executed \d+ tests?|Test Suite .* (passed|failed)',line,re.I):print(line[:700])
              assert result.returncode==0,'Affected Core classes or selected compatibility methods failed'
              count=verify_swift_stream(text,expected)
              print('current_affected_swift_rules=passed distinct_test_ids='+str(count))
              print('actual_method_inventory_sha256='+hashlib.sha256(json.dumps(sorted(expected),separators=(',',':')).encode()).hexdigest())
          finally:log.unlink(missing_ok=True)
          PYCODE

      - name: Exercise actual narrated paper CLI media and recovery
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          from __future__ import annotations
          import argparse
          from copy import deepcopy
          from datetime import datetime, timezone
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import plistlib
          import shutil
          import struct
          import subprocess
          import tempfile
          import uuid
          import wave
          import zlib

          DECODER=r"""
          import Foundation
          import AVFoundation
          import CoreVideo
          import AudioToolbox
          let asset=AVURLAsset(url:URL(fileURLWithPath:CommandLine.arguments.last!))
          let tracks=asset.tracks(withMediaType:.video)
          guard tracks.count==1 else {fatalError("one actual video stream required")}
          let reader=try AVAssetReader(asset:asset)
          let output=AVAssetReaderTrackOutput(track:tracks[0],outputSettings:[kCVPixelBufferPixelFormatTypeKey as String:kCVPixelFormatType_32BGRA])
          reader.add(output)
          guard reader.startReading() else {fatalError("full video decoder did not start")}
          var frames=0
          while let sample=output.copyNextSampleBuffer() {
              guard let pixel=CMSampleBufferGetImageBuffer(sample) else {fatalError("video buffer missing")}
              CVPixelBufferLockBaseAddress(pixel,.readOnly)
              let width=CVPixelBufferGetWidth(pixel),height=CVPixelBufferGetHeight(pixel),stride=CVPixelBufferGetBytesPerRow(pixel)
              guard width==1280,height==720,let base=CVPixelBufferGetBaseAddress(pixel) else {fatalError("actual landscape geometry changed")}
              var captionWhite=0
              for y in 0..<height {
                  let row=base.assumingMemoryBound(to:UInt8.self).advanced(by:y*stride)
                  for x in 0..<width {
                      let p=row.advanced(by:x*4),r=Int(p[2]),g=Int(p[1]),b=Int(p[0])
                      let caption=x>=72 && x<1208 && y>=602 && y<702
                      if caption {
                          if r>180 && g>180 && b>180 {captionWhite+=1}
                      } else {
                          guard abs(r-209)<30,abs(g-37)<25,abs(b-37)<25 else {fatalError("unexpected title/footer/CTA outside the declared caption band")}
                      }
                  }
              }
              guard captionWhite>20 else {fatalError("actual white cinema subtitle missing")}
              CVPixelBufferUnlockBaseAddress(pixel,.readOnly)
              frames+=1
          }
          guard reader.status == .completed,frames==30 else {fatalError("complete thirty-frame video stream required")}
          let audioTracks=asset.tracks(withMediaType:.audio)
          guard audioTracks.count==1 else {fatalError("complete source audio track missing")}
          let audioReader=try AVAssetReader(asset:asset)
          let audio=AVAssetReaderTrackOutput(track:audioTracks[0],outputSettings:[AVFormatIDKey:kAudioFormatLinearPCM,AVLinearPCMBitDepthKey:16,AVLinearPCMIsFloatKey:false,AVLinearPCMIsNonInterleaved:false,AVSampleRateKey:48000,AVNumberOfChannelsKey:1])
          audioReader.add(audio)
          guard audioReader.startReading() else {fatalError("full audio decoder did not start")}
          var count=0,crossings=0,tailCount=0
          var square=0.0,tailSquare=0.0
          var previous:Int16=0
          while let sample=audio.copyNextSampleBuffer() {
              guard let block=CMSampleBufferGetDataBuffer(sample) else {fatalError("decoded PCM missing")}
              var length=0,total=0
              var bytes:UnsafeMutablePointer<Int8>?
              guard CMBlockBufferGetDataPointer(block,atOffset:0,lengthAtOffsetOut:&length,totalLengthOut:&total,dataPointerOut:&bytes)==kCMBlockBufferNoErr,let bytes else {fatalError("decoded PCM buffer inaccessible")}
              for i in 0..<(total/2) {
                  let value=UnsafeRawPointer(bytes).load(fromByteOffset:i*2,as:Int16.self)
                  if count>0 && ((previous<0 && value>=0) || (previous>=0 && value<0)) {crossings+=1}
                  let amplitude=Double(value)/32768
                  square+=amplitude*amplitude
                  if count>=36000 {tailSquare+=amplitude*amplitude;tailCount+=1}
                  previous=value;count+=1
              }
          }
          guard audioReader.status == .completed,count>=47000,count<=51072,tailCount>8000 else {fatalError("original full-duration audio was shortened")}
          let rms=sqrt(square/Double(count)),tailRMS=sqrt(tailSquare/Double(tailCount))
          let frequency=Double(crossings)*48000/Double(count)/2
          guard rms>0.01,tailRMS>0.005,frequency>400,frequency<480 else {fatalError("source tone or its final quarter was lost")}
          print("native_decoded_frames=30 subtitles=present title_footer_cta=absent complete_audio=present tail_audio=present")
          """

          def png():
              def chunk(kind,raw):
                  return struct.pack('>I',len(raw))+kind+raw+struct.pack('>I',zlib.crc32(kind+raw)&0xffffffff)
              scan=(b'\0'+bytes((209,37,37,255))*1280)*720
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1280,720,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(scan))+chunk(b'IEND',b'')

          def checked_bytes(path,workspace,size,digest):
              path=Path(path)
              assert path.is_file() and not path.is_symlink(),'restored file must be a regular file'
              assert workspace.resolve(strict=True) in path.resolve(strict=True).parents,'file must belong to the independent workspace'
              raw=path.read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest,'actual file bytes or SHA differ from the receipt'
              return raw

          def artifact_inventory(artifacts,workspace):
              assert len(artifacts)==4,'all four production artifacts are required'
              identities=[item['id'] for item in artifacts];names=[Path(item['path']).name for item in artifacts]
              assert all(identities) and all(names) and len(set(identities))==4 and len(set(names))==4,'artifact identities and filenames must be unique'
              return {(item['id'],Path(item['path']).name):
                      ({key:value for key,value in item.items() if key!='path'},
                       checked_bytes(item['path'],workspace,item['bytes'],item['sha256'])) for item in artifacts}

          def restored_original(asset,original,workspace):
              originals=list(workspace.rglob(asset['hash']+'.'+asset['ext']))
              assert len(originals)==1,'exactly one independent CAS original is required'
              assert checked_bytes(originals[0],workspace,asset['bytes'],asset['hash'])==original.read_bytes(),'restored original differs from the imported input'

          def main():
              parser=argparse.ArgumentParser(description='Synthetic original-image/original-PCM paper CLI chain; not spoken-audio or business-film acceptance')
              parser.add_argument('--binary',type=Path,default=Path(os.environ['VIDEO_FREE_BINARY']))
              parser.add_argument('--scratch',type=Path,default=Path(os.environ['RUNNER_TEMP']))
              args=parser.parse_args()
              binary=args.binary.resolve(strict=True)
              root=Path(tempfile.mkdtemp(prefix='paper-explanation-',dir=args.scratch.resolve(strict=True)))
              work=root/'workspace';restored=root/'restored';calls=0
              def call(label,command,body=None,*,dry=False,target=work,ok=True,timeout=40):
                  nonlocal calls
                  data=deepcopy(body or {})
                  data.setdefault('request_id',str(uuid.uuid5(uuid.NAMESPACE_URL,str(root)+'/'+label)))
                  argv=[str(binary),*command.split(),'--workspace',str(target),'--input','-']
                  if dry:argv.append('--dry-run')
                  response=subprocess.run(argv,input=json.dumps(data),text=True,capture_output=True,timeout=timeout)
                  value=json.loads(response.stdout)
                  assert not response.stderr,(label,'unexpected CLI diagnostics')
                  assert value.get('ok') is ok and value.get('request_id')==data['request_id'],(label,value.get('state'),value.get('error'))
                  assert (response.returncode==0) is ok,(label,response.returncode)
                  calls+=1
                  return value
              def result(value):
                  raw=value['result'];return json.loads(raw) if isinstance(raw,str) else raw
              def project(wid,pid,*,target=work):
                  return next(p for p in result(call('query-'+str(calls),'projects list',dict(workspace_id=wid),target=target)) if p['id']==pid)
              try:
                  image=root/'synthetic-original.png';image.write_bytes(png())
                  tone=root/'synthetic-original.wav'
                  pcm=b''.join(struct.pack('<h',round(6000*math.sin(2*math.pi*440*n/48000))) for n in range(48000))
                  with wave.open(str(tone),'wb') as stream:
                      stream.setnchannels(1);stream.setsampwidth(2);stream.setframerate(48000);stream.writeframes(pcm)
